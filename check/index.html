<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>무브앤플레이 출석</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10200a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 키오스크: 왼쪽은 센터 사진 위에 시계와 인사(무대), 오른쪽은 번호 입력(책상). 세로 화면이면 위아래로.
   홈페이지(index.html)와 같은 색·글꼴·로고·사선 막대. */
:root{
  --bg:#f5f7f1; --surface:#ffffff; --ink:#1b2316; --muted:#5d6955; --line:#dbe3cf;
  --green:#6eb92b; --green-deep:#2f5a12; --green-soft:#e8f3dc; --on-green:#10200a;
  --danger:#b3261e; --warn:#8a5300;
  --stage:#10200a; --stage-ink:#f1f6ea; --stage-mut:rgba(241,246,234,.72);
  --f-display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11160e; --surface:#1a2116; --ink:#e8eee0; --muted:#a3ae99; --line:#2e3828;
  --green:#86cf45; --green-deep:#b6e58c; --green-soft:#223218; --on-green:#0e1a08;
  --danger:#ff8f86; --warn:#f0b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11160e; --surface:#1a2116; --ink:#e8eee0; --muted:#a3ae99; --line:#2e3828;
  --green:#86cf45; --green-deep:#b6e58c; --green-soft:#223218; --on-green:#0e1a08;
  --danger:#ff8f86; --warn:#f0b45a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.mono{font-family:var(--f-mono)}

/* ---------- 휴대폰(QR) 모드 ---------- */
body.phone{background:var(--stage);color:var(--stage-ink);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));min-height:100%}
.phone main{width:100%;max-width:420px}
.phone .brand{display:flex;align-items:center;gap:10px;margin:0 0 28px}
.phone .brand img{width:26px;height:auto}
.phone .brand b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em}
.phone .brand span{font-size:13px;color:var(--stage-mut)}
.phone h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.2;margin:0 0 10px}
.phone .k{font-size:16px;color:var(--stage-mut);line-height:1.65;margin:0 0 24px}
.phone .big{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.3;margin:0 0 12px}
.phone input#ph{width:100%;font:500 24px var(--f-mono);text-align:center;padding:16px;border:0;border-radius:16px;letter-spacing:.04em;background:var(--surface);color:var(--ink)}
.phone .btn{display:block;width:100%;border:0;border-radius:999px;padding:18px;font-size:19px;font-weight:800;margin-top:12px;background:var(--green);color:var(--on-green)}
.phone .btn.sub{background:transparent;border:2px solid var(--stage-mut);color:var(--stage-ink);font-weight:700;font-size:16px;padding:14px}
.phone .btn small{display:block;font:500 14px var(--f-mono);opacity:.75;margin-top:4px}
.phone label{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:14px;color:var(--stage-mut)}
.phone label input{width:20px;height:20px;accent-color:var(--green)}
.phone .err{background:var(--surface);color:var(--danger);border-radius:12px;padding:12px;font-weight:700;margin-top:14px}

/* ---------- 키오스크 ---------- */
body.kiosk{overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.kk{height:100%;display:grid;grid-template-columns:minmax(0,44fr) minmax(0,56fr)}
@media (orientation:portrait){.kk{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,34fr) minmax(0,66fr)}}

/* 무대: 사진 + 시계 */
.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;justify-content:space-between;
  padding:max(28px,env(safe-area-inset-top,0px)) 36px max(32px,env(safe-area-inset-bottom,0px)) max(36px,env(safe-area-inset-left,0px))}
.stage .ph{position:absolute;inset:0;margin:0}
.stage .ph img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.8s ease,transform 11s linear}
.stage .ph img.on{opacity:1;transform:scale(1)}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,32,10,.55) 0%,rgba(16,32,10,.12) 32%,rgba(16,32,10,.35) 58%,rgba(16,32,10,.92) 100%)}
.stage>*:not(.ph){position:relative;z-index:1}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-brand{display:flex;align-items:center;gap:12px}
.s-brand img{width:34px;height:auto}
.s-brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1}
.s-brand span{font-size:14px;color:var(--stage-mut);font-weight:700}
.s-tag{font:500 12px var(--f-mono);letter-spacing:.14em;color:var(--stage-mut);border:1px solid rgba(241,246,234,.35);border-radius:999px;padding:5px 12px}
.s-bottom{display:flex;flex-direction:column;gap:10px}
.bars{display:flex;gap:7px;align-items:flex-end;height:58px;margin-bottom:8px}
.bars i{display:block;width:14px;background:var(--green);transform:skewX(-14deg);border-radius:2px}
.bars i:nth-child(1){height:42px;opacity:.6}.bars i:nth-child(2){height:58px}.bars i:nth-child(3){height:34px;opacity:.85}
.clock{font:500 clamp(64px,10.5vw,132px)/.9 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.clock .c{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.date{font:500 clamp(15px,1.6vw,19px) var(--f-mono);letter-spacing:.12em;color:var(--stage-mut);text-transform:uppercase}
.hello{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.2vw,40px);line-height:1.15;margin:14px 0 0;max-width:12em}
.hello em{font-style:normal;color:var(--green)}
@media (orientation:portrait){
  .stage{padding-bottom:24px}
  .s-bottom{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .bars{display:none}
  .clock{font-size:clamp(56px,13vw,104px)}
  .hello{margin:0;text-align:right;font-size:clamp(24px,4.6vw,36px)}
}

/* 책상: 입력·결과 */
.desk{position:relative;display:flex;flex-direction:column;justify-content:center;gap:26px;overflow:auto;transition:background .4s ease,color .4s ease;
  padding:max(28px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 40px}
@media (orientation:portrait){.desk{padding:28px max(28px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));justify-content:flex-start;gap:22px}}
.desk>*{width:100%;max-width:520px;margin-inline:auto}
.eyebrow{font:600 13px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep);margin-block:0 10px;display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:22px;height:3px;background:var(--green);transform:skewX(-14deg)}
.ask{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1.18;margin:0;text-wrap:balance}
.ask em{font-style:normal;color:var(--green-deep)}

.disp{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;font:500 clamp(34px,4.4vw,54px)/1 var(--f-mono);font-variant-numeric:tabular-nums;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.disp .g{display:flex;gap:.04em}
.disp .d{width:.66em;text-align:center}
.disp .d.e{color:var(--muted);opacity:.45}
.disp .d.cur{color:var(--green);animation:blink 1.1s steps(1) infinite}
.disp .dash{color:var(--muted);font-weight:400}
.msg{min-height:24px;margin:-12px 0 0;font-size:17px;font-weight:700;color:var(--danger)}
.msg:empty{visibility:hidden}
.disp.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pad button{height:clamp(70px,9.4vh,92px);border:1px solid var(--line);border-radius:20px;background:var(--surface);font:500 clamp(30px,3.4vw,38px) var(--f-mono);color:var(--ink);transition:transform .08s,background .15s}
.pad button:active{transform:scale(.96);background:var(--green-soft)}
.pad .fn{font:800 18px var(--f-body);color:var(--muted)}
.pad .ok{background:var(--green);border-color:var(--green);color:var(--on-green);font:400 24px var(--f-display);letter-spacing:.04em}
.pad .ok:disabled{background:var(--surface);border-color:var(--line);color:var(--line);cursor:default}
.foot{font-size:14px;color:var(--muted);text-align:center;margin-top:-6px}

/* 고르기 (이용권·수업) */
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;border:2px solid var(--ink);background:var(--surface);border-radius:22px;padding:24px 26px;transition:transform .08s,background .15s}
.opt:active{transform:scale(.98);background:var(--green-soft)}
.opt b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15}
.opt span{font:500 17px var(--f-mono);color:var(--muted);white-space:nowrap}
.opt span::after{content:" →";color:var(--green-deep)}
.back{text-align:left;border:0;background:none;color:var(--muted);font-size:17px;font-weight:700;padding:8px 0;text-decoration:underline;text-underline-offset:5px}

/* 결과 */
.desk.ok{background:var(--green);color:var(--on-green)}
.desk.ok .eyebrow{color:var(--on-green)}.desk.ok .eyebrow::before{background:var(--on-green)}
.desk.same{background:var(--green-soft)}
.who{font-family:var(--f-display);font-weight:400;font-size:clamp(64px,8.4vw,112px);line-height:1;margin:0;letter-spacing:.01em}
.who small{font-size:.42em;margin-left:.12em}
.said{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.6vw,44px);margin:6px 0 0;line-height:1.2}
.count{display:flex;align-items:baseline;gap:14px;padding-top:18px;border-top:3px solid currentColor}
.count b{font:600 clamp(72px,9vw,120px)/.9 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count span{font-size:22px;font-weight:800}
.count.low b{color:var(--on-green)}
.note{font-size:19px;font-weight:700;line-height:1.55;margin-block:0}
.note.warn{display:inline-block;background:var(--on-green);color:var(--green);border-radius:12px;padding:8px 14px}
.next{display:flex;align-items:center;gap:16px}
.next button{border:2px solid currentColor;background:transparent;border-radius:999px;padding:14px 26px;font-size:18px;font-weight:800}
.timer{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden}
.timer i{display:block;height:100%;background:currentColor;transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.wait{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0;display:flex;align-items:center;gap:16px}
.wait .bars{height:44px;margin:0}
.wait .bars i{animation:hop 1s ease-in-out infinite}
.wait .bars i:nth-child(2){animation-delay:.15s}.wait .bars i:nth-child(3){animation-delay:.3s}
@keyframes hop{50%{transform:skewX(-14deg) translateY(-10px)}}
.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stage .ph img{transform:none}}

const fmt = p => p.replace(/^(\d{3})(\d{3,4})(\d{4})$/, (_, a, b, c) => `${a}-${'*'.repeat(b.length)}-${c}`);
// 키오스크 화면엔 뒤에 선 사람도 보이니 이름 가운데를 가려요 (김도현 → 김*현)
const nm = n => { n = String(n ?? ''); return !KIOSK || n.length <= 1 ? n : n.length === 2 ? n[0] + '*' : n[0] + '*'.repeat(n.length - 2) + n[n.length - 1]; };
const pad2 = n => String(n).padStart(2, '0');
const hhmm = (d = new Date()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

let timer, busy = false, view;
function after(ms, fn){ clearTimeout(timer); if (ms) timer = setTimeout(fn, ms); }

/* ================= 휴대폰(QR) 모드 ================= */
const brand = `<div class="brand"><img src="${LOGO}" alt=""><b>MOVE&amp;PLAY</b><span>순천점</span></div>`;
function phoneHome(err){
  const m = $('#m');
  if (!key) { m.innerHTML = `${brand}<p class="big">센터에 붙어 있는 QR을 찍어 주세요</p>`; return; }
  const saved = get();
  if (saved) {
    m.innerHTML = `${brand}<h1>출석</h1><p class="k">아래 버튼만 누르면 출석돼요</p>
      <button class="btn" id="go">출석하기<small>${fmt(saved)}</small></button>
      <button class="btn sub" id="chg">다른 번호로 출석</button>${err ? `<div class="err">${esc(err)}</div>` : ''}`;
    $('#go').onclick = () => send({ phone: saved });
    $('#chg').onclick = () => { set(''); phoneHome(); };
    return;
  }
  m.innerHTML = `${brand}<h1>출석</h1><p class="k">센터에 등록한 <b>휴대폰 번호</b>를 넣어 주세요<br>처음 한 번만 넣으면 다음부터는 버튼만 누르면 돼요</p>
    <input id="ph" type="tel" inputmode="numeric" placeholder="010 1234 5678" autocomplete="tel">
    <label><input type="checkbox" id="rm" checked>이 폰에 번호 기억하기</label>
    <button class="btn" id="go">출석하기</button>${err ? `<div class="err">${esc(err)}</div>` : ''}`;
  $('#go').onclick = () => {
    const ph = $('#ph').value.replace(/\D/g, '');
    if (!/^01\d{8,9}$/.test(ph)) return phoneHome('휴대폰 번호를 다시 확인해 주세요');
    if ($('#rm').checked) set(ph);
    send({ phone: ph });
  };
}

/* ================= 키오스크 ================= */
function kioskBoot(){
  document.body.className = 'kiosk';
  document.body.innerHTML = `<div class="kk">
    <aside class="stage" aria-hidden="true">
      <figure class="ph">${PHOTOS.map((p, i) => `<img src="${p}" alt="" class="${i ? '' : 'on'}">`).join('')}</figure>
      <div class="s-top"><div class="s-brand"><img src="${LOGO}" alt=""><b>MOVE&amp;PLAY</b><span>순천점</span></div><span class="s-tag">CHECK-IN</span></div>
      <div class="s-bottom">
        <div><div class="bars"><i></i><i></i><i></i></div><div class="clock" id="clock"></div><div class="date" id="date"></div></div>
        <p class="hello" id="hello"></p>
      </div>
    </aside>
    <section class="desk" id="desk" aria-live="polite"></section></div>`;
  view = $('#desk');
  // 사진은 9초마다 천천히 바뀌어요
  let pi = 0; const imgs = [...document.querySelectorAll('.ph img')];
  setInterval(() => { imgs[pi].classList.remove('on'); pi = (pi + 1) % imgs.length; imgs[pi].classList.add('on'); }, 9000);
  const tick = () => {
    const d = new Date(), h = d.getHours();
    $('#clock').innerHTML = `${pad2(h)}<span class="c">:</span>${pad2(d.getMinutes())}`;
    $('#date').textContent = `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} · ${'SUN MON TUE WED THU FRI SAT'.split(' ')[d.getDay()]}`;
    $('#hello').innerHTML = h < 11 ? '좋은 아침이에요.<br>오늘도 <em>움직여요.</em>' : h < 17 ? '천천히,<br>같이 <em>움직여요.</em>' : '오늘 하루도<br><em>수고했어요.</em>';
    // 새벽 3시에 한 번 새로 불러와서 고친 내용을 받아요
    if (h === 3 && d.getMinutes() === 0 && !busy) location.reload();
  };
  tick(); setInterval(tick, 10000);
  // 화면이 꺼지지 않게 (지원하는 브라우저에서만)
  const lock = () => { try { navigator.wakeLock?.request('screen').catch(() => {}); } catch(e) {} };
  lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock());
  document.addEventListener('contextmenu', e => e.preventDefault());
  // 실물 키보드(블루투스 키패드 등)도 받기
  document.addEventListener('keydown', e => {
    if (busy) return;
    const b = /^\d$/.test(e.key) ? view.querySelector(`[data-n="${e.key}"]`) : e.key === 'Backspace' ? view.querySelector('[data-n="del"]') : e.key === 'Enter' ? view.querySelector('[data-n="ok"]') : null;
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });
  kioskHome();
}
function desk(html, cls){ view.className = 'desk in' + (cls ? ' ' + cls : ''); view.innerHTML = html; }

function kioskHome(err){
  busy = false; after(0);
  if (!key) return desk(`<div><p class="eyebrow">SETUP</p><h1 class="ask">출석 화면 주소가<br>올바르지 않아요</h1></div><p class="note">관리자 앱 → 설정 → 센터 태블릿 출석 화면에서 다시 열어 주세요.</p>`);
  let ph = '010';
  desk(`<div><p class="eyebrow">휴대폰 번호로 출석</p><h1 class="ask">센터에 등록한<br><em>휴대폰 번호</em>를 눌러 주세요</h1></div>
    <div class="disp" id="disp" aria-label="입력한 번호"></div>
    <p class="msg" id="msg" role="alert">${esc(err || '')}</p>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="fn" data-n="del">지움</button><button data-n="0">0</button><button class="ok" data-n="ok" id="ok">출석</button></div>
    <p class="foot">번호가 바뀌었거나 등록이 안 됐다면 선생님께 말씀해 주세요</p>`);
  const show = () => {
    const t = (ph + '           ').slice(0, 11), cell = i => `<span class="d${t[i] === ' ' ? (i === ph.length ? ' e cur' : ' e') : ''}">${t[i] === ' ' ? (i === ph.length ? '_' : '·') : t[i]}</span>`;
    const g = (a, b) => `<span class="g">${[...Array(b - a).keys()].map(i => cell(a + i)).join('')}</span>`;
    $('#disp').innerHTML = `${g(0, 3)}<span class="dash">–</span>${g(3, 7)}<span class="dash">–</span>${g(7, 11)}`;
    $('#ok').disabled = !/^01\d{8,9}$/.test(ph);
  };
  const submit = () => { if (/^01\d{8,9}$/.test(ph)) send({ phone: ph }); };
  view.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const n = b.dataset.n;
    after(0); $('#msg').textContent = '';
    if (n === 'ok') return submit();
    ph = n === 'del' ? ph.slice(0, -1) : (ph + n).slice(0, 11);
    show();
    if (ph.length === 11) submit();
  });
  show();
  if (err) { $('#disp').classList.add('shake'); after(20000, () => kioskHome()); }
}

function kioskWait(){ desk(`<p class="wait"><span class="bars"><i></i><i></i><i></i></span>출석 중…</p>`); }
function kioskChoose(name, q, opts, onPick){
  desk(`<div><p class="eyebrow">${esc(nm(name))}님</p><h1 class="ask">${q}</h1></div>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><b>${esc(o.label)}</b><span>${esc(o.sub || '선택')}</span></button>`).join('')}</div>
    <button class="back" id="bk">처음으로</button>`);
  view.querySelectorAll('[data-i]').forEach(b => b.onclick = () => onPick(opts[+b.dataset.i]));
  $('#bk').onclick = () => kioskHome();
  after(30000, kioskHome);
}
function kioskDone(name, ok, r){
  const ms = 6000, l = r && r.left != null ? +r.left : null;
  const body = !ok ? `<p class="note">오늘은 이미 출석했어요.<br>오늘도 즐겁게 움직여요!</p>`
    : l != null ? `<div class="count${l <= 3 ? ' low' : ''}"><b>${pad2(l)}</b><span>회 남았어요</span></div>${l <= 3 ? '<div><p class="note warn">재등록은 선생님께 문의해 주세요</p></div>' : ''}`
    : r && r.msg ? `<p class="note">${esc(r.msg)}</p>` : '';
  desk(`<p class="eyebrow">${ok ? 'CHECKED IN' : 'ALREADY IN'} · ${hhmm()}</p>
    <div><h1 class="who">${esc(nm(name))}<small>님</small></h1><p class="said">${ok ? '출석 완료!' : '반가워요!'}</p></div>
    ${body}
    <div class="next"><button id="bk">다음 분 출석</button><span class="timer"><i style="animation-duration:${ms}ms"></i></span></div>`, ok ? 'ok' : 'same');
  $('#bk').onclick = () => kioskHome();
  after(ms, kioskHome);
}

/* ================= 공통: 출석 보내기 ================= */
const home = err => KIOSK ? kioskHome(err) : phoneHome(err);
async function send(body){
  if (busy) return;   // 두 번 눌러도 한 번만 출석
  busy = true; after(0);
  if (KIOSK) kioskWait(); else $('#m').innerHTML = `${brand}<p class="big">출석 중…</p>`;
  let r;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: key, ...body }) });
    r = await res.json();
  } catch(e) { return home('인터넷 연결을 확인하고 다시 눌러 주세요'); }
  busy = false;
  if (!r.ok) {
    if (r.code === 'phone') set('');
    if (r.code === 'dup') return KIOSK ? kioskDone(r.name, false) : phoneDone(`${esc(r.name)}님`, '오늘은 이미 출석했어요. 오늘도 화이팅!');
    return home(r.msg || (KIOSK ? '번호를 다시 확인하시거나 선생님께 말씀해 주세요' : '다시 시도해 주세요'));
  }
  if (r.step === 'pick') {
    const opts = r.options.map(o => ({ id: o.id, label: o.label, sub: o.left != null ? `남은 ${o.left}회` : '' }));
    if (KIOSK) return kioskChoose(r.name, '오늘 쓸 <em>이용권</em>을<br>골라 주세요', opts, o => send({ ...body, passId: o.id }));
    $('#m').innerHTML = `${brand}<p class="big">${esc(r.name)}님<br>오늘 쓸 이용권을 골라 주세요</p>
      ${opts.map((o, i) => `<button class="btn" data-i="${i}">${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}
      <button class="btn sub" id="bk">처음으로</button>`;
    document.querySelectorAll('[data-i]').forEach(b => b.onclick = () => send({ ...body, passId: opts[+b.dataset.i].id }));
    $('#bk').onclick = () => home();
  } else if (r.step === 'kind') {
    const opts = [{ k: '개인', label: '개인 PT', sub: '1:1 · 2:1' }, { k: '그룹', label: '그룹 수업', sub: '케틀벨 · Move ON' }];
    if (KIOSK) return kioskChoose(r.name, '오늘 어떤 <em>수업</em>인가요?', opts, o => send({ ...body, passId: r.passId, kind: o.k }));
    $('#m').innerHTML = `${brand}<p class="big">${esc(r.name)}님<br>오늘 어떤 수업인가요?</p>
      ${opts.map((o, i) => `<button class="btn" data-i="${i}">${o.label}</button>`).join('')}<button class="btn sub" id="bk">처음으로</button>`;
    document.querySelectorAll('[data-i]').forEach(b => b.onclick = () => send({ ...body, passId: r.passId, kind: opts[+b.dataset.i].k }));
    $('#bk').onclick = () => home();
  } else if (r.step === 'done') {
    if (KIOSK) return kioskDone(r.name, true, r);
    const l = r.left != null ? +r.left : null;
    phoneDone(`${esc(r.name)}님 출석 완료!`, l != null ? (l <= 3 ? `남은 횟수 <b>${l}회</b><br>재등록은 선생님께 문의해 주세요` : `남은 횟수 <b>${l}회</b>`) : esc(r.msg || ''));
  } else home();
}
function phoneDone(t, s){ $('#m').innerHTML = `${brand}<p class="big">${t}</p><p class="k">${s}</p>`; }

if (KIOSK) kioskBoot(); else { document.body.className = 'phone'; phoneHome(); }
</script></body></html>
