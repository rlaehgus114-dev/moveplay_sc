<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>무브앤플레이 출석</title>
<style>
:root{--g:#1f6f4a;--g2:#e8f3ec;--ink:#1d2421;--mut:#6b746f;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--g);color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:26px;margin:0 0 6px}
.k{font-size:16px;opacity:.85;line-height:1.6;margin:0 0 22px}
.big{font-size:30px;font-weight:800;margin:0 0 10px;line-height:1.3}
input{width:100%;font-size:24px;text-align:center;padding:16px;border:0;border-radius:14px;letter-spacing:.05em}
button{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800;margin-top:12px;background:#fff;color:var(--g)}
button.sub{background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:16px;padding:14px}
button small{display:block;font-size:14px;font-weight:500;opacity:.75;margin-top:4px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;margin-top:12px;opacity:.9}
label input{width:20px;height:20px}
.err{background:#fff;color:var(--red);border-radius:12px;padding:12px;font-weight:700;margin-top:14px}
</style></head><body><main id="m"><p class="big">불러오는 중…</p></main>
<script>
// Apps Script 웹 앱 주소 (큐알출석.gs 배포 후 넣기)
const API = 'https://script.google.com/macros/s/AKfycbznZIGsnQYTuOGQUxwLpDvdi-akqlmGDu5rhH3EusRobiClrR6D4bGNlNn9yfTwWb_D/exec';
const $ = s => document.querySelector(s);
const m = $('#m');
const key = new URLSearchParams(location.search).get('k') || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = () => { try { return localStorage.getItem('mp_phone') || ''; } catch(e) { return ''; } };
const set = v => { try { v ? localStorage.setItem('mp_phone', v) : localStorage.removeItem('mp_phone'); } catch(e) {} };
const fmt = p => p.replace(/^(\d{3})(\d{3,4})(\d{4})$/, (_, a, b, c) => `${a}-${'*'.repeat(b.length)}-${c}`);

function home(err){
  if (!key) { m.innerHTML = '<p class="big">센터에 붙어 있는 QR을 찍어 주세요</p>'; return; }
  const saved = get();
  if (saved) {
    m.innerHTML = `<h1>무브앤플레이 출석</h1><p class="k">아래 버튼만 누르면 출석돼요</p>
      <button id="go">출석하기<small>${fmt(saved)}</small></button>
      <button class="sub" id="chg">다른 번호로 출석</button>${err ? `<div class="err">${esc(err)}</div>` : ''}`;
    $('#go').onclick = () => send({ phone: saved });
    $('#chg').onclick = () => { set(''); home(); };
    return;
  }
  m.innerHTML = `<h1>무브앤플레이 출석</h1><p class="k">센터에 등록한 <b>휴대폰 번호</b>를 넣어 주세요<br>처음 한 번만 넣으면 다음부터는 버튼만 누르면 돼요</p>
    <input id="ph" type="tel" inputmode="numeric" placeholder="010 1234 5678" autocomplete="tel">
    <label><input type="checkbox" id="rm" checked>이 폰에 번호 기억하기</label>
    <button id="go">출석하기</button>${err ? `<div class="err">${esc(err)}</div>` : ''}`;
  $('#go').onclick = () => {
    const ph = $('#ph').value.replace(/\D/g, '');
    if (!/^01\d{8,9}$/.test(ph)) return home('휴대폰 번호를 다시 확인해 주세요');
    if ($('#rm').checked) set(ph);
    send({ phone: ph });
  };
}

async function send(body){
  m.innerHTML = '<p class="big">출석 중…</p>';
  let r;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: key, ...body }) });
    r = await res.json();
  } catch(e) { return home('인터넷 연결을 확인하고 다시 눌러 주세요'); }
  if (!r.ok) { if (r.code === 'phone') set(''); return r.code === 'dup' ? done(`${esc(r.name)}님`, '오늘은 이미 출석했어요. 오늘도 화이팅!') : home(r.msg); }
  if (r.step === 'pick') {
    m.innerHTML = `<p class="big">${esc(r.name)}님<br>오늘 쓸 이용권을 골라 주세요</p>
      ${r.options.map(o => `<button data-p="${esc(o.id)}">${esc(o.label)}${o.left != null ? `<small>남은 ${o.left}회</small>` : ''}</button>`).join('')}
      <button class="sub" id="bk">처음으로</button>`;
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => send({ ...body, passId: b.dataset.p }));
    $('#bk').onclick = () => home();
  } else if (r.step === 'kind') {
    m.innerHTML = `<p class="big">${esc(r.name)}님<br>오늘 어떤 수업인가요?</p>
      <button data-k="개인">개인 PT</button><button data-k="그룹">그룹 수업</button><button class="sub" id="bk">처음으로</button>`;
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => send({ ...body, passId: r.passId, kind: b.dataset.k }));
    $('#bk').onclick = () => home();
  } else if (r.step === 'done') {
    done(`${esc(r.name)}님 출석 완료!`, r.left != null ? (r.left <= 3 ? `남은 횟수 <b>${r.left}회</b><br>재등록은 선생님께 문의해 주세요` : `남은 횟수 <b>${r.left}회</b>`) : esc(r.msg || ''));
  }
}
function done(t, s){ m.innerHTML = `<p class="big">${t}</p><p class="k">${s}</p>`; }
home();
</script></body></html>
