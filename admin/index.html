<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>무플 관리자</title>
<style>
:root{--g:#1f6f4a;--g2:#e8f3ec;--ink:#1d2421;--mut:#6b746f;--line:#e3e7e4;--red:#c0392b;--amber:#b7791f;--bg:#f6f8f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:4}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.big{font-size:22px;font-weight:800;text-align:right;min-width:56px}
.big small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--g)}
.btn.red{background:#fbeaea;color:var(--red)}
.btn:disabled{opacity:.4}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--g2);color:var(--g);margin-left:6px;font-weight:600}
.tag.amber{background:#fdf3e1;color:var(--amber)}
.tag.red{background:#fbeaea;color:var(--red)}
.tag.gray{background:#eee;color:#777}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.center{text-align:center;padding:40px 16px}
.hint{font-size:13px;color:var(--mut);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hist{font-size:14px;max-height:240px;overflow:auto;margin-top:8px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.wk .d{font-weight:700;color:var(--g);display:flex;justify-content:space-between;gap:8px}
.wk ul{margin:6px 0 0;padding-left:18px}.wk li{margin:2px 0}
.wk .hw{margin-top:6px;color:#8a5a00;background:#fdf3e1;border-radius:8px;padding:4px 8px}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chipset button{border:1px solid var(--line);background:var(--g2);color:var(--g);border-radius:99px;padding:5px 10px;font-size:13px}
dialog{max-height:90vh;overflow:auto}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>무플 관리자</h1><button id="btnOut" class="hidden">로그아웃</button></header>
<nav id="nav" class="hidden">
  <button data-t="check" class="on">출석</button>
  <button data-t="book">예약</button>
  <button data-t="plan">계획</button>
  <button data-t="members">회원</button>
  <button data-t="log">기록</button>
  <button data-t="more">설정</button>
</nav>
<main id="app"><div class="center">불러오는 중…</div></main>
<div class="toast" id="toast"></div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script type="module">
const ADMIN_EMAIL = 'rlaehgus114@gmail.com';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysSince = s => s ? Math.floor((new Date(today()) - new Date(s)) / 86400000) : null;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const wdOf = s => new Date(s + 'T00:00:00Z').getUTCDay();
const fmtDay = s => `${+s.slice(5, 7)}/${+s.slice(8)}(${WD[wdOf(s)]})`;
// 그룹 수업 시간표 (요일 번호: 0=일 ~ 6=토)
const GROUP_SLOTS = {
  2: [['10:00', '케틀벨 그룹 PT']],
  3: [['18:00', 'Move ON'], ['19:00', 'Move ON'], ['20:00', 'Move ON']],
  5: [['10:00', '케틀벨 그룹 PT']],
  6: [['10:00', '스윙·겟업'], ['11:00', 'Move ON'], ['12:00', 'Move ON']]
};
const GROUP_CAP = 6;  // 그룹 수업 정원 (넘으면 경고만)
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- 1. Firebase 설정 (이 기기 브라우저에만 저장) ---------- */
// 웹용 Firebase 설정값 (공개용 식별값 — 데이터 접근은 보안 규칙으로 관리자 계정만 허용)
const DEFAULT_CFG = {
  apiKey: 'AIzaSyAgRa8fj3qJG9SWM_Gyeml_lay6y91HKC8',
  authDomain: 'moveplay-suncheon.firebaseapp.com',
  projectId: 'moveplay-suncheon',
  storageBucket: 'moveplay-suncheon.firebasestorage.app',
  messagingSenderId: '321589961889',
  appId: '1:321589961889:web:2282627a7b966d9109fce0'
};
let cfg = DEFAULT_CFG;
try { cfg = JSON.parse(localStorage.getItem('mp_fb_cfg') || 'null') || DEFAULT_CFG; } catch(e) {}
if (!cfg) { setupScreen(); } else { boot(cfg).catch(e => { app.innerHTML = `<div class="card">시작 오류: ${esc(e.message)}<br><br><button class="btn ghost" id="reset">설정 다시 입력</button></div>`; $('#reset').onclick = () => { try{localStorage.removeItem('mp_fb_cfg')}catch(e){} location.reload(); }; }); }

function setupScreen(){
  app.innerHTML = `<div class="card"><div class="name">처음 한 번만 설정</div>
  <p class="hint">Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에 있는 <b>firebaseConfig</b> 부분을 통째로 복사해서 아래에 붙여넣으세요.<br>이 값은 이 기기 브라우저에만 저장돼요.</p>
  <textarea id="cfgIn" rows="9" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ... };"></textarea>
  <div style="margin-top:10px"><button class="btn" id="cfgSave">저장하고 시작</button></div></div>`;
  $('#cfgSave').onclick = () => {
    const raw = $('#cfgIn').value;
    const o = {};
    raw.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (_, k, v) => { o[k] = v; });
    if (!o.apiKey || !o.projectId) return toast('apiKey, projectId 가 안 보여요. 다시 복사해 주세요.');
    try { localStorage.setItem('mp_fb_cfg', JSON.stringify(o)); } catch(e) { return toast('이 브라우저는 저장이 막혀 있어요.'); }
    location.reload();
  };
}

/* ---------- 2. 시작 ---------- */
let fb, db, auth, state = { passes: [], logs: [], books: [], tab: 'check', filter: '전체', q: '', bookDate: null };

async function boot(cfg){
  const [{ initializeApp }, A, F] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  fb = { ...A, ...F };
  const fapp = initializeApp(cfg);
  auth = A.getAuth(fapp);
  db = F.getFirestore(fapp);
  A.onAuthStateChanged(auth, async user => {
    if (!user) return loginScreen();
    if (user.email !== ADMIN_EMAIL) { app.innerHTML = `<div class="center">관리자 계정이 아니에요 (${esc(user.email)})<br><br><button class="btn ghost" id="o">다른 계정으로</button></div>`; $('#o').onclick = () => fb.signOut(auth); return; }
    $('#nav').classList.remove('hidden'); $('#btnOut').classList.remove('hidden');
    $('#btnOut').onclick = () => fb.signOut(auth).then(() => location.reload());
    await loadAll(); render();
  });
}

function loginScreen(){
  $('#nav').classList.add('hidden'); $('#btnOut').classList.add('hidden');
  app.innerHTML = `<div class="center"><p class="hint">관리자 구글 계정으로 로그인하세요.</p><button class="btn" id="li">구글로 로그인</button></div>`;
  $('#li').onclick = () => fb.signInWithPopup(auth, new fb.GoogleAuthProvider()).catch(e => toast('로그인 실패: ' + e.code));
}

async function loadAll(){
  const ps = await fb.getDocs(fb.collection(db, 'passes'));
  state.passes = ps.docs.map(d => ({ id: d.id, ...d.data() }));
  for (const p of state.passes) {
    if (isMoney(p) && p.balance == null && MONEY_INIT[p.name]) {
      await fb.updateDoc(fb.doc(db, 'passes', p.id), MONEY_INIT[p.name]); Object.assign(p, MONEY_INIT[p.name]);
    }
  }
  const since = new Date(); since.setDate(since.getDate() - 120);
  const ls = await fb.getDocs(fb.query(fb.collection(db, 'attendance'), fb.where('date', '>=', since.toISOString().slice(0, 10)), fb.orderBy('date', 'desc'), fb.limit(500)));
  state.logs = ls.docs.map(d => ({ id: d.id, ...d.data() }));
  const bs = await fb.getDocs(fb.query(fb.collection(db, 'bookings'), fb.where('date', '>=', addDays(today(), -7))));
  state.books = bs.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ---------- 계산 ---------- */
const used = p => (p.usedBefore || 0) + (p.usedAfter || 0);
const left = p => (p.total || 0) - used(p);
const isMoney = p => p.kind === '금액권';
const moneyLeft = p => (p.balance || 0) - (p.spent || 0);
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
// 금액권 처음 설정값 (출석관리 시트 '금액권' 탭 2026-10-31 기준)
const MONEY_INIT = { '한가려': { balance: 465000, priceP: 60000, priceG: 25000, spent: 0 } };
function status(p){
  if (p.archived) return ['만료', 'gray'];
  if (isMoney(p)) {
    const m = moneyLeft(p);
    if (m < Math.min(p.priceP || 0, p.priceG || 0) || m <= 0) return ['충전 안내', 'red'];
    if (m < (p.priceP || 0) * 2) return ['곧 소진', 'amber'];
    const d = daysSince(p.lastDate);
    if (d !== null && d >= 21) return ['연락 필요', 'amber'];
    return ['금액권', ''];
  }
  const l = left(p), d = daysSince(p.lastDate);
  if (l <= 0) return ['재등록 안내', 'red'];
  if (l <= 3) return ['곧 소진', 'amber'];
  if (d !== null && d >= 21) return ['연락 필요', 'amber'];
  return ['정상', ''];
}

/* ---------- 화면 ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  state.tab = b.dataset.t; render();
});

function render(){ ({ check: renderCheck, book: renderBook, plan: renderPlan, members: renderMembers, log: renderLog, more: renderMore })[state.tab](); window.scrollTo(0, 0); }

/* ---------- 예약 ---------- */
function renderBook(){
  const d = state.bookDate || (state.bookDate = addDays(today(), 1));
  const list = state.books.filter(b => b.date === d).sort((a, b) => a.time.localeCompare(b.time));
  const slots = (GROUP_SLOTS[wdOf(d)] || []).map(([t, n]) => ({ t, n }));
  const times = [...new Set([...slots.map(s => s.t), ...list.map(b => b.time)])].sort();
  const byId = Object.fromEntries(state.passes.map(p => [p.id, p]));
  app.innerHTML = `
  <div class="toolbar">
    <button class="btn ghost" id="prev">◀</button>
    <input type="date" id="bd" value="${d}">
    <button class="btn ghost" id="next">▶</button>
  </div>
  <div class="row" style="margin-bottom:10px"><div class="grow name">${fmtDay(d)} 예약 ${list.length}명</div><button class="btn" id="addB">+ 예약</button></div>
  <p class="hint">수업 전날 저녁 8시에 예약된 회원에게 '수업 전날 안내' 알림톡이 자동으로 나가요.</p>
  ${times.length ? times.map(t => {
    const s = slots.find(x => x.t === t); const bs = list.filter(b => b.time === t);
    const over = s && bs.length > GROUP_CAP;
    return `<div class="card"><div class="row"><div class="grow"><span class="name">${t}</span> <span class="sub">${s ? esc(s.n) + ' · ' + bs.length + '/' + GROUP_CAP + '명' : '개인 PT'}</span>${over ? '<span class="tag red">정원 초과</span>' : ''}</div>
      <button class="btn ghost" data-addt="${t}" style="padding:6px 10px;font-size:13px">+ 추가</button></div>
      ${bs.map(b => { const p = byId[b.passId]; return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div class="grow">${esc(b.name)} <span class="sub">${esc(p?.cls || '')}${p && !p.phone ? ' · <b style="color:var(--red)">번호 없음</b>' : ''}${b.notified ? ' · 알림 발송됨' : ''}</span></div><button class="btn red" data-delb="${b.id}" style="padding:6px 10px;font-size:13px">취소</button></div>`; }).join('')}
    </div>`; }).join('') : '<div class="center hint">이날은 정해진 그룹 수업이 없어요. + 예약으로 PT를 넣어 주세요.</div>'}`;
  $('#bd').onchange = e => { state.bookDate = e.target.value; renderBook(); };
  $('#prev').onclick = () => { state.bookDate = addDays(d, -1); renderBook(); };
  $('#next').onclick = () => { state.bookDate = addDays(d, 1); renderBook(); };
  $('#addB').onclick = () => addBooking(d, '');
  app.querySelectorAll('[data-addt]').forEach(b => b.onclick = () => addBooking(d, b.dataset.addt));
  app.querySelectorAll('[data-delb]').forEach(b => b.onclick = () => delBooking(b.dataset.delb));
}

function addBooking(date, time){
  const act = state.passes.filter(p => !p.archived).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const slot = (GROUP_SLOTS[wdOf(date)] || []).find(s => s[0] === time);
  dialog(`
    <div class="name">${fmtDay(date)} 예약 추가</div>
    <label>시간</label><input id="b_time" type="time" step="1800" value="${time || '10:00'}">
    <label>회원 (여러 명 선택 가능)</label>
    <input id="b_q" placeholder="이름 검색" style="margin-bottom:6px">
    <div id="b_list" class="hist" style="max-height:260px">${act.map(p => `<label class="row" data-n="${esc(p.name)}" style="margin:0;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px"><input type="checkbox" value="${p.id}" style="width:auto"> <span class="grow">${esc(p.name)} <span class="sub">${esc(p.cls)} · ${isMoney(p) ? '잔액 ' + won(moneyLeft(p)) : '남음 ' + left(p)}</span></span></label>`).join('')}</div>
    ${slot ? `<p class="hint">${esc(slot[1])} 수업 시간이에요.</p>` : ''}
    <div class="row" style="margin-top:14px;gap:8px"><span class="grow"></span><button class="btn ghost" id="cn">취소</button><button class="btn" id="sv">예약</button></div>`);
  $('#b_q').oninput = e => document.querySelectorAll('#b_list [data-n]').forEach(l => l.style.display = l.dataset.n.includes(e.target.value.trim()) ? '' : 'none');
  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    const t = $('#b_time').value; const ids = [...document.querySelectorAll('#b_list input:checked')].map(i => i.value);
    if (!t || !ids.length) return toast('시간과 회원을 골라 주세요');
    const batch = fb.writeBatch(db); const added = [];
    ids.forEach(id => {
      const p = state.passes.find(x => x.id === id);
      if (state.books.some(b => b.date === date && b.time === t && b.passId === id)) return;
      const ref = fb.doc(fb.collection(db, 'bookings'));
      const gs = (GROUP_SLOTS[wdOf(date)] || []).find(x => x[0] === t);
      const doc = { date, time: t, passId: id, name: p.name, cls: p.cls, slot: gs ? gs[1] : '', notified: false, createdAt: fb.serverTimestamp() };
      batch.set(ref, doc); added.push({ id: ref.id, ...doc });
    });
    await batch.commit(); state.books.push(...added);
    closeDlg(); toast(`${added.length}명 예약했어요`); renderBook();
  };
}

async function delBooking(id){
  const b = state.books.find(x => x.id === id);
  if (!confirm(`${b.name}님 ${fmtDay(b.date)} ${b.time} 예약을 취소할까요?`)) return;
  await fb.deleteDoc(fb.doc(db, 'bookings', id));
  state.books = state.books.filter(x => x.id !== id);
  toast('예약을 취소했어요'); renderBook();
}

function passList(list, withBtn){
  if (!list.length) return `<div class="center hint">해당하는 회원이 없어요</div>`;
  return list.map(p => { const [s, c] = status(p); return `
  <div class="card"><div class="row">
    <div class="grow" data-open="${p.id}" style="cursor:pointer">
      <div class="name">${esc(p.name)}<span class="tag ${c}">${s}</span>${withBtn && bookedTime(p.id) ? `<span class="tag" style="background:#e7eefc;color:#2f56b0">예약 ${bookedTime(p.id)}</span>` : ''}</div>
      <div class="sub">${esc(p.cls)} · ${esc(p.label || '')}${p.lastDate ? ' · 마지막 ' + esc(p.lastDate.slice(5)) : ''}</div>
    </div>
    ${isMoney(p) ? `<div class="big" style="font-size:17px">${won(moneyLeft(p))}<small>잔액</small></div>` : `<div class="big">${left(p)}<small>남음 / ${p.total}</small></div>`}
    ${withBtn ? `<button class="btn" data-ck="${p.id}" ${(isMoney(p) ? moneyLeft(p) <= 0 : left(p) <= 0) ? 'disabled' : ''}>출석</button>` : ''}
  </div></div>`; }).join('');
}

function bindList(){
  app.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => checkIn(b.dataset.ck, $('#ckDate')?.value || today()));
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openPass(b.dataset.open));
}

function filtered(){
  const q = state.q.trim();
  return state.passes.filter(p => !p.archived)
    .filter(p => state.filter === '전체' || p.cls.includes(state.filter))
    .filter(p => !q || p.name.includes(q))
    .sort((a, b) => (bookedTime(a.id) || '99').localeCompare(bookedTime(b.id) || '99') || a.name.localeCompare(b.name, 'ko'));
}
function bookedTime(passId){
  const d = $('#ckDate')?.value || today();
  const b = state.books.filter(x => x.passId === passId && x.date === d).map(x => x.time).sort();
  return b[0] || '';
}

function renderCheck(){
  const done = new Set(state.logs.filter(l => l.date === today()).map(l => l.passId));
  app.innerHTML = `
  <div class="toolbar"><input id="q" placeholder="이름 검색" value="${esc(state.q)}"><input id="ckDate" type="date" value="${today()}" style="max-width:150px"></div>
  <div class="chips">${['전체', '1:1', '2:1', '그룹'].map(f => `<button data-f="${f}" class="${state.filter === f ? 'on' : ''}">${f}</button>`).join('')}</div>
  <p class="hint">오늘 출석 ${done.size}명 · 이름을 누르면 상세 기록</p>
  ${passList(filtered(), true)}`;

/* ---------- 동작 ---------- */
async function checkIn(passId, date){
  const p = state.passes.find(x => x.id === passId);
  if (isMoney(p)) return moneyCheckIn(p, date);
  if (state.logs.some(l => l.passId === passId && l.date === date) && !confirm(`${p.name}님은 ${date}에 이미 출석했어요. 한 번 더 찍을까요?`)) return;
  const ref = fb.doc(fb.collection(db, 'attendance'));
  const batch = fb.writeBatch(db);
  batch.set(ref, { passId, name: p.name, date, createdAt: fb.serverTimestamp() });
  const newLast = !p.lastDate || date > p.lastDate ? date : p.lastDate;
  batch.update(fb.doc(db, 'passes', passId), { usedAfter: fb.increment(1), lastDate: newLast });
  await batch.commit();
  p.usedAfter = (p.usedAfter || 0) + 1; p.lastDate = newLast;
  state.logs.unshift({ id: ref.id, passId, name: p.name, date });
  toast(`${p.name}님 출석 · 남은 ${left(p)}회`);
  render();
  if (isPT(p)) writeWorkout(p.name, date);
}

function moneyCheckIn(p, date){
  dialog(`
    <div class="name">${esc(p.name)}님 출석 · 어떤 수업인가요?</div>
    <p class="hint">현재 잔액 ${won(moneyLeft(p))}</p>
    <div style="display:grid;gap:10px;margin-top:10px">
      <button class="btn" data-mk="개인">개인 PT · −${won(p.priceP)}</button>
      <button class="btn" data-mk="그룹">그룹 수업 · −${won(p.priceG)}</button>
    </div>
    <div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn ghost" id="cn">취소</button></div>`);
  $('#cn').onclick = closeDlg;
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.mk, amount = kind === '개인' ? (p.priceP || 0) : (p.priceG || 0);
    if (amount > moneyLeft(p) && !confirm(`잔액(${won(moneyLeft(p))})보다 차감액이 커요. 그래도 출석할까요?`)) return;
    const ref = fb.doc(fb.collection(db, 'attendance'));
    const batch = fb.writeBatch(db);
    const log = { passId: p.id, name: p.name, date, kind, amount, createdAt: fb.serverTimestamp() };
    batch.set(ref, log);
    const newLast = !p.lastDate || date > p.lastDate ? date : p.lastDate;
    batch.update(fb.doc(db, 'passes', p.id), { spent: fb.increment(amount), lastDate: newLast });
    await batch.commit();
    p.spent = (p.spent || 0) + amount; p.lastDate = newLast;
    state.logs.unshift({ id: ref.id, ...log });
    closeDlg(); toast(`${p.name}님 ${kind} 출석 · 잔액 ${won(moneyLeft(p))}`); render();
    if (kind === '개인') writeWorkout(p.name, date);
  });
}

async function undo(logId){
  const l = state.logs.find(x => x.id === logId); if (!l) return;
  if (!confirm(`${l.name}님 ${l.date} 출석을 취소할까요?`)) return;
  const p = state.passes.find(x => x.id === l.passId);
  const batch = fb.writeBatch(db);
  batch.delete(fb.doc(db, 'attendance', logId));
  const rest = state.logs.filter(x => x.passId === l.passId && x.id !== logId).map(x => x.date).sort();
  const newLast = rest.length ? rest[rest.length - 1] : (p.importedLast || p.lastDate);
  if (p && l.amount) batch.update(fb.doc(db, 'passes', p.id), { spent: fb.increment(-l.amount), lastDate: newLast || null });
  else if (p) batch.update(fb.doc(db, 'passes', p.id), { usedAfter: fb.increment(-1), lastDate: newLast || null });
  await batch.commit();
  if (p && l.amount) { p.spent = (p.spent || 0) - l.amount; p.lastDate = newLast; }
  else if (p) { p.usedAfter = (p.usedAfter || 0) - 1; p.lastDate = newLast; }
  state.logs = state.logs.filter(x => x.id !== logId);
  toast('취소했어요'); render();
}

/* ---------- 운동 기록 ---------- */
const isPT = p => /1:1|2:1/.test(p.cls || '') && !/^그룹/.test(p.cls || '');
const wkSort = (a, b) => (b.date || '9999').localeCompare(a.date || '9999');
const wkDay = w => w.dateLabel || (w.date ? fmtDay(w.date) : '날짜 미기재');
async function loadWorkouts(member){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'workouts'), fb.where('member', '==', member)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(wkSort);
}
function wkCard(w, tools){
  return `<div class="wk"><div class="d"><span>${esc(wkDay(w))}${w.note ? ' · ' + esc(w.note) : ''}</span>${tools ? `<span><button class="btn ghost" data-we="${w.id}" style="padding:2px 8px;font-size:12px">수정</button></span>` : ''}</div>
    <ul>${(w.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>${w.homework ? `<div class="hw">숙제 · ${esc(w.homework)}</div>` : ''}</div>`;
}
function topMoves(wks){
  const cnt = {}, label = {};
  wks.forEach(w => (w.items || []).forEach(i => { const t = i.split(' - ')[0].trim(), k = t.replace(/\s/g, ''); if (t.length <= 24) { cnt[k] = (cnt[k] || 0) + 1; label[k] = label[k] || t; } }));
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => label[x[0]]);
}
async function showWorkouts(member){
  const wks = await loadWorkouts(member);
  dialog(`<div class="row"><div class="grow name">${esc(member)}님 운동 기록 ${wks.length}회</div><button class="btn" id="cl">닫기</button></div>
    ${wks.map(w => wkCard(w, true)).join('')}`);
  $('#cl').onclick = closeDlg;
  document.querySelectorAll('[data-we]').forEach(b => b.onclick = () => writeWorkout(member, null, wks.find(w => w.id === b.dataset.we)));
}
async function writeWorkout(member, date, existing){
  const wks = await loadWorkouts(member);
  const last = wks.find(w => !existing || w.id !== existing.id);
  const moves = topMoves(wks);
  const w = existing || { date: date || today(), items: [], homework: '', note: '' };
  let plan = null;
  if (!existing) {
    const ps = (await loadPlans(member)).filter(x => !x.done);
    const d0 = w.date, wk = weekStart(d0);
    plan = ps.find(x => x.day === d0) || ps.filter(x => x.week === wk).sort((a, b) => (a.day || '9').localeCompare(b.day || '9'))[0] || null;
    if (plan) { w.items = plan.items || []; w.homework = plan.homework || ''; }
  }
  dialog(`
    <div class="name">${esc(member)}님 ${existing ? '운동 기록 수정' : '오늘 운동 기록'}</div>
    <label>날짜</label><input type="date" id="w_d" value="${esc(w.date && !w.date.endsWith('-00') ? w.date : today())}">
    ${last && !existing ? `<div class="wk" style="background:var(--bg)"><div class="d"><span>지난 수업 · ${esc(wkDay(last))}</span><button class="btn ghost" id="w_copy" style="padding:2px 8px;font-size:12px">그대로 불러오기</button></div><ul>${(last.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>${last.homework ? `<div class="hw">숙제 · ${esc(last.homework)}</div>` : ''}</div>` : ''}
    ${moves.length ? `<label>자주 한 운동 (누르면 추가)</label><div class="chipset">${moves.map(m => `<button data-mv="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}
    ${plan ? `<div class="wk" style="border-color:var(--g)"><div class="d"><span>이번 주 계획${plan.title ? ' · ' + esc(plan.title) : ''}을 불러왔어요</span></div><p class="hint" style="margin-top:4px">실제로 한 대로 고쳐서 저장하세요</p></div>` : ''}
    <label>오늘 한 운동 (한 줄에 하나씩)</label>
    <textarea id="w_i" rows="7" placeholder="예) KB 스윙 80개 - 12kg">${esc((w.items || []).join('\n'))}</textarea>
    <label>숙제</label><input id="w_h" value="${esc(w.homework || '')}" placeholder="예) 겟업 10번, 벽 밀기">
    <label>메모 (통증·컨디션 등)</label><input id="w_n" value="${esc(w.note || '')}">
    <div class="row" style="margin-top:14px;gap:8px">${existing ? '<button class="btn red" id="w_del">삭제</button>' : ''}<span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  const ta = $('#w_i');
  const add = t => { ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' : '') + t; };
  if ($('#w_copy')) $('#w_copy').onclick = () => { ta.value = (last.items || []).join('\n'); if (!$('#w_h').value) $('#w_h').value = last.homework || ''; toast('지난 수업을 불러왔어요. 바뀐 것만 고치세요'); };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => add(b.dataset.mv));
  $('#cn').onclick = closeDlg;
  if ($('#w_del')) $('#w_del').onclick = async () => { if (!confirm('이 기록을 지울까요?')) return; await fb.deleteDoc(fb.doc(db, 'workouts', existing.id)); toast('지웠어요'); showWorkouts(member); };
  $('#sv').onclick = async () => {
    const items = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!items.length) return toast('운동을 한 줄 이상 적어 주세요');
    const d = { member, date: $('#w_d').value, dateLabel: '', items, homework: $('#w_h').value.trim(), note: $('#w_n').value.trim() };
    if (existing) await fb.updateDoc(fb.doc(db, 'workouts', existing.id), d);
    else await fb.addDoc(fb.collection(db, 'workouts'), { ...d, createdAt: fb.serverTimestamp() });
    if (plan) await fb.updateDoc(fb.doc(db, 'plans', plan.id), { done: true, doneDate: d.date });
    closeDlg(); toast('운동 기록을 저장했어요');
  };
}

const weekStart = s => { const d = new Date(s + 'T00:00:00Z'); const k = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - k); return d.toISOString().slice(0, 10); };
async function loadPlans(member){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'plans'), fb.where('member', '==', member)));

}
async function loadGroupLogs(group){

  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.date.localeCompare(a.date));

function weekGroupClasses(wk){
  const out = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(wk, i), byName = {};
    (GROUP_SLOTS[wdOf(day)] || []).forEach(([t, n]) => (byName[n] = byName[n] || []).push(t));
    Object.entries(byName).forEach(([n, ts]) => out.push({ group: n, day, times: ts }));
  }
  return out;
}

    <div class="card"><div class="row"><div class="grow name">${esc(n)}</div><button class="btn" data-np="${esc(n)}" style="padding:6px 12px;font-size:14px">+ 계획</button></div>
    ${ps.map(x => `<div class="wk"><div class="d"><span>${x.day ? esc(fmtDay(x.day)) : '요일 미정'}${x.title ? ' · ' + esc(x.title) : ''}${x.done ? ' · <span style="color:var(--mut)">완료</span>' : ''}</span><button class="btn ghost" data-ep="${x.id}" style="padding:2px 8px;font-size:12px">수정</button></div><ul>${(x.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>${x.homework ? `<div class="hw">숙제 · ${esc(x.homework)}</div>` : ''}</div>`).join('') || '<p class="hint">아직 계획 없음</p>'}
    </div>`; }).join('')}`;
  $('#pp').onclick = () => { state.planWeek = addDays(wk, -7); renderPlan(); };
  $('#pn').onclick = () => { state.planWeek = addDays(wk, 7); renderPlan(); };
  app.querySelectorAll('[data-np]').forEach(b => b.onclick = () => editPlan(b.dataset.np, wk));
  app.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => { const x = plans.find(y => y.id === b.dataset.ep); x.group ? editPlan(null, wk, x, x.group, x.day) : editPlan(x.member, wk, x); });
  app.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => { const [g, d] = b.dataset.gp.split('|'); editPlan(null, wk, null, g, d); });
  app.querySelectorAll('[data-gd]').forEach(b => b.onclick = () => groupDone(plans.find(y => y.id === b.dataset.gd)));
}
function groupDone(x){
  dialog(`<div class="name">${esc(fmtDay(x.day))} ${esc(x.group)} 수업 기록</div>
    <p class="hint">계획대로 했으면 그대로 저장, 바뀐 건 고쳐서 저장하세요.</p>
    <label>한 운동</label><textarea id="g_i" rows="7">${esc((x.items || []).join('\n'))}</textarea>
    <label>메모 (분위기·다음에 바꿀 점)</label><input id="g_n">
    <div class="row" style="margin-top:14px;gap:8px"><span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    const items = $('#g_i').value.split('\n').map(t => t.trim()).filter(Boolean);
    await fb.addDoc(fb.collection(db, 'groupWorkouts'), { group: x.group, date: x.day, items, note: $('#g_n').value.trim(), createdAt: fb.serverTimestamp() });
    await fb.updateDoc(fb.doc(db, 'plans', x.id), { done: true, doneDate: x.day, items });
    closeDlg(); toast('그룹 수업 기록을 저장했어요'); renderPlan();
  };
}
async function editPlan(member, wk, ex, group, fixedDay){
  let wks, ps;
  if (group) {
    wks = await loadGroupLogs(group);
    const sp = await fb.getDocs(fb.query(fb.collection(db, 'plans'), fb.where('group', '==', group)));
    ps = sp.docs.map(d => ({ id: d.id, ...d.data() }));
  } else [wks, ps] = await Promise.all([loadWorkouts(member), loadPlans(member)]);
  const last = wks[0], prev = ps.filter(x => x.id !== (ex && ex.id)).sort((a, b) => (b.week + (b.day || '')).localeCompare(a.week + (a.day || '')))[0];
  const moves = topMoves(wks);
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(wk, i));
  const x = ex || { day: fixedDay || '', title: '', items: [], homework: '' };
  dialog(`
    <div class="name">${group ? esc(fmtDay(fixedDay)) + ' ' + esc(group) : esc(member) + '님'} ${group ? '수업' : fmtDay(wk) + ' 주'} 계획</div>
    ${group ? '<p class="hint">같은 날 모든 타임에 같은 계획을 써요.</p>' : ''}
    <label style="${group ? 'display:none' : ''}">수업 요일 (모르면 비워 두세요)</label>
    <select id="p_d" style="${group ? 'display:none' : ''}"><option value="">요일 미정</option>${days.map(d => `<option value="${d}" ${x.day === d ? 'selected' : ''}>${fmtDay(d)}</option>`).join('')}</select>
    <label>제목 (선택, 예: 하체·코어)</label><input id="p_t" value="${esc(x.title || '')}">
    ${last ? `<div class="wk" style="background:var(--bg)"><div class="d"><span>지난 ${group ? '같은 수업' : '수업'} · ${esc(wkDay(last))}</span><button class="btn ghost" id="p_last" style="padding:2px 8px;font-size:12px">불러오기</button></div><ul>${(last.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : ''}
    ${prev ? `<div class="row" style="margin-top:6px"><span class="grow hint">지난 계획 (${prev.day ? esc(fmtDay(prev.day)) : esc(fmtDay(prev.week)) + ' 주'})</span><button class="btn ghost" id="p_prev" style="padding:2px 8px;font-size:12px">불러오기</button></div>` : ''}
    ${moves.length ? `<label>자주 한 운동 (누르면 추가)</label><div class="chipset">${moves.map(m => `<button data-mv="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}
    <label>할 운동 (한 줄에 하나씩)</label>
    <textarea id="p_i" rows="7">${esc((x.items || []).join('\n'))}</textarea>
    <label>숙제 (선택)</label><input id="p_h" value="${esc(x.homework || '')}">
    <div class="row" style="margin-top:14px;gap:8px">${ex ? '<button class="btn red" id="p_del">삭제</button>' : ''}<span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  const ta = $('#p_i');
  const add = t => { ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' : '') + t; };
  if ($('#p_last')) $('#p_last').onclick = () => { ta.value = (last.items || []).join('\n'); toast('지난 수업을 불러왔어요. 이번 주에 바꿀 것만 고치세요'); };
  if ($('#p_prev')) $('#p_prev').onclick = () => { ta.value = (prev.items || []).join('\n'); if (!$('#p_h').value) $('#p_h').value = prev.homework || ''; toast('지난 계획을 불러왔어요'); };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => add(b.dataset.mv));
  $('#cn').onclick = closeDlg;
  if ($('#p_del')) $('#p_del').onclick = async () => { if (!confirm('이 계획을 지울까요?')) return; await fb.deleteDoc(fb.doc(db, 'plans', ex.id)); closeDlg(); renderPlan(); };
  $('#sv').onclick = async () => {
    const items = ta.value.split('\n').map(t => t.trim()).filter(Boolean);
    if (!items.length) return toast('운동을 한 줄 이상 적어 주세요');
    const d = { member: member || '', group: group || '', week: wk, day: group ? fixedDay : $('#p_d').value, title: $('#p_t').value.trim(), items, homework: $('#p_h').value.trim() };
    if (ex) await fb.updateDoc(fb.doc(db, 'plans', ex.id), d);
    else await fb.addDoc(fb.collection(db, 'plans'), { ...d, done: false, createdAt: fb.serverTimestamp() });
    closeDlg(); toast('계획을 저장했어요'); if (state.tab === 'plan') renderPlan();
  };
}

async function openPass(id){
  const p = state.passes.find(x => x.id === id);
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'attendance'), fb.where('passId', '==', id)));
  const rows = snap.docs.map(d => d.data()).sort((a, b) => b.date.localeCompare(a.date));
  const [s, c] = status(p);
  const [wks, prof] = await Promise.all([loadWorkouts(p.name), fb.getDoc(fb.doc(db, 'profiles', p.name))]);
  const goal = prof.exists() ? (prof.data().goal || '') : '';
  let gHist = [];
  if (!isPT(p) && !isMoney(p) && rows.length) {
    const ds = [...new Set(rows.map(r => r.date))].slice(0, 10);
    const gs = await fb.getDocs(fb.query(fb.collection(db, 'groupWorkouts'), fb.where('date', 'in', ds)));
    gHist = gs.docs.map(d => d.data()).sort((a, b) => b.date.localeCompare(a.date));
  }
  dialog(`
    <div class="name">${esc(p.name)}<span class="tag ${c}">${s}</span></div>
    <p style="margin:8px 0" class="hint"><b style="color:var(--ink)">목표</b> ${goal ? esc(goal) : '아직 없음'} <button class="btn ghost" id="gl" style="padding:2px 8px;font-size:12px">수정</button></p>
    <div class="sub">${esc(p.cls)} · ${esc(p.label || '')}</div>
    ${isMoney(p)
      ? `<p>충전 잔액 <b>${won(p.balance)}</b> · 사용 <b>${won(p.spent)}</b> · <b>남은 금액 ${won(moneyLeft(p))}</b><br><span class="hint">개인 PT −${won(p.priceP)} · 그룹 수업 −${won(p.priceG)}</span></p>`
      : `<p>등록 <b>${p.total}</b>회 · 사용 <b>${used(p)}</b>회 (시트에서 옮긴 ${p.usedBefore || 0} + 앱 ${p.usedAfter || 0}) · <b>남음 ${left(p)}</b>회</p>`}
    <p class="hint">휴대폰: ${p.phone ? esc(p.phone.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3')) : '<b style="color:var(--red)">없음 — 수정에서 넣어 주세요 (알림톡 발송에 필요)</b>'}</p>
    ${p.note ? `<p class="hint">메모: ${esc(p.note)}</p>` : ''}
    <div class="row" style="margin-top:6px"><div class="grow name" style="font-size:15px">운동 기록 ${wks.length}회</div><button class="btn" id="wn" style="padding:6px 12px;font-size:14px">+ 오늘 기록</button></div>
    ${wks.slice(0, 2).map(w => wkCard(w)).join('') || '<p class="hint">아직 없음</p>'}
    ${wks.length > 2 ? '<button class="btn ghost" id="wa" style="margin-top:8px;width:100%">운동 기록 전체 보기</button>' : ''}
    ${gHist.length ? `<div class="name" style="font-size:15px;margin-top:12px">참여한 그룹 수업</div>${gHist.slice(0, 3).map(g => `<div class="wk"><div class="d"><span>${esc(fmtDay(g.date))} · ${esc(g.group)}</span></div><ul>${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}` : ''}
    <div class="name" style="font-size:14px;margin-top:14px">앱 출석 기록 ${rows.length}회</div>
    <div class="hist">${rows.map(r => `<div><span>${esc(r.date)}</span><span>${r.amount ? esc(r.kind) + ' −' + won(r.amount) : ''}</span></div>`).join('') || '<p class="hint">아직 없음</p>'}</div>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="btn ghost" id="ed">수정</button>
      <button class="btn ghost" id="rn">재등록</button>
      <button class="btn red" id="ar">${p.archived ? '되살리기' : '만료 처리'}</button>
      <span class="grow"></span><button class="btn" id="cl">닫기</button>
    </div>`);
  $('#cl').onclick = closeDlg;
  $('#ed').onclick = () => editPass(p);
  $('#wn').onclick = () => writeWorkout(p.name, today());
  if ($('#wa')) $('#wa').onclick = () => showWorkouts(p.name);
  $('#gl').onclick = async () => {
    const g = prompt(`${p.name}님 수업 목표`, goal); if (g === null) return;
    await fb.setDoc(fb.doc(db, 'profiles', p.name), { goal: g.trim() }, { merge: true }); toast('목표를 저장했어요'); openPass(p.id);
  };
  $('#rn').onclick = () => editPass({ name: p.name, cls: p.cls, phone: p.phone || '', kind: p.kind || '', priceP: p.priceP, priceG: p.priceG, _renew: p.id });
  $('#ar').onclick = async () => { await fb.updateDoc(fb.doc(db, 'passes', id), { archived: !p.archived }); p.archived = !p.archived; closeDlg(); render(); };
}

function editPass(p){
  const isNew = !p || !p.id;
  p = p || { cls: '1:1 PT' };
  dialog(`
    <div class="name">${isNew ? (p._renew ? '재등록' : '새 이용권') : '이용권 수정'}</div>
    <label>이름</label><input id="f_name" value="${esc(p.name || '')}">
    <label>수업</label><select id="f_cls">${['1:1 PT', '2:1 PT', '그룹 PT', '1:1 PT,그룹 PT'].map(v => `<option ${p.cls === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <label>이용권 이름 (예: 재등록 8회, 오전 케틀벨반 24회)</label><input id="f_label" value="${esc(p.label || '')}">
    <label>종류</label><select id="f_kind"><option value="" ${isMoney(p) ? '' : 'selected'}>횟수권</option><option value="금액권" ${isMoney(p) ? 'selected' : ''}>금액권</option></select>
    <div id="k_cnt">
      <label>등록 횟수</label><input id="f_total" type="number" inputmode="numeric" value="${p.total ?? ''}">
      ${isNew ? '' : `<label>시트에서 옮긴 사용 횟수 (보정용)</label><input id="f_ub" type="number" inputmode="numeric" value="${p.usedBefore || 0}">`}
    </div>
    <div id="k_money">
      <label>${isNew ? '충전 금액(원)' : '충전 잔액(원) — 충전하면 더한 금액으로 고쳐 주세요'}</label><input id="f_bal" type="number" inputmode="numeric" value="${isNew ? '' : (p.balance ?? '')}">
      <label>개인 PT 1회 차감(원)</label><input id="f_pp" type="number" inputmode="numeric" value="${p.priceP ?? 60000}">
      <label>그룹 수업 1회 차감(원)</label><input id="f_pg" type="number" inputmode="numeric" value="${p.priceG ?? 25000}">
    </div>
    <label>휴대폰 번호 (알림톡 발송용, 숫자만)</label><input id="f_phone" inputmode="numeric" maxlength="11" value="${esc(p.phone || '')}">
    <label>메모</label><input id="f_note" value="${esc(p.note || '')}">
    ${p._renew ? '<p class="hint">저장하면 이전 이용권은 자동으로 만료 처리돼요.</p>' : ''}
    <div class="row" style="margin-top:14px;gap:8px"><span class="grow"></span><button class="btn ghost" id="cn">취소</button><button class="btn" id="sv">저장</button></div>`);
  const syncKind = () => { const m = $('#f_kind').value === '금액권'; $('#k_cnt').style.display = m ? 'none' : ''; $('#k_money').style.display = m ? '' : 'none'; };
  $('#f_kind').onchange = syncKind; syncKind();
  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    const d = { name: $('#f_name').value.trim(), cls: $('#f_cls').value, label: $('#f_label').value.trim(), kind: $('#f_kind').value,
      total: +$('#f_total').value || 0, phone: $('#f_phone').value.replace(/\D/g, ''), note: $('#f_note').value.trim() };
    d.phone4 = d.phone.slice(-4);
    if (d.kind === '금액권') {
      d.balance = +$('#f_bal').value || 0; d.priceP = +$('#f_pp').value || 0; d.priceG = +$('#f_pg').value || 0; d.total = 0;
      if (!d.name || !d.balance) return toast('이름과 충전 금액을 넣어 주세요');
      if (isNew) d.spent = 0;
    } else if (!d.name || !d.total) return toast('이름과 등록 횟수를 넣어 주세요');
    if (d.phone && !/^01\d{8,9}$/.test(d.phone)) return toast('휴대폰 번호를 확인해 주세요');
    if (isNew) {
      const ref = await fb.addDoc(fb.collection(db, 'passes'), { ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false, startDate: today(), createdAt: fb.serverTimestamp() });
      state.passes.push({ id: ref.id, ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false });
      if (p._renew) { await fb.updateDoc(fb.doc(db, 'passes', p._renew), { archived: true }); state.passes.find(x => x.id === p._renew).archived = true; }
    } else {
      if (d.kind !== '금액권') d.usedBefore = +$('#f_ub').value || 0;
      await fb.updateDoc(fb.doc(db, 'passes', p.id), d);
      Object.assign(p, d);
    }
    closeDlg(); toast('저장했어요'); render();
  };
}

async function importFile(file){
  if (!file) return;
  let rows; try { rows = JSON.parse(await file.text()); } catch (e) { return toast('파일을 읽을 수 없어요'); }
  if (state.passes.length && !confirm(`이미 이용권이 ${state.passes.length}개 있어요. 그래도 추가할까요? (중복될 수 있어요)`)) return;
  const batch = fb.writeBatch(db);
  rows.forEach(r => batch.set(fb.doc(fb.collection(db, 'passes')), {
    name: r.name, cls: r.cls, label: r.label || '', kind: r.kind || '', total: r.total || 0,
    usedBefore: r.used || 0, usedAfter: 0, lastDate: r.lastDate || null, importedLast: r.lastDate || null,
    phone4: r.phone4 || '', note: r.note || '', archived: !!r.archived, startDate: null, createdAt: fb.serverTimestamp()
  }));
  await batch.commit();
  await loadAll(); toast(`${rows.length}개 가져왔어요`); state.tab = 'members';
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'members')); render();
}

async function backup(){
  const a = await fb.getDocs(fb.collection(db, 'attendance'));
  const data = { exportedAt: new Date().toISOString(), passes: state.passes, attendance: a.docs.map(d => ({ id: d.id, ...d.data(), createdAt: null })) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  const el = document.createElement('a'); el.href = url; el.download = `무플_백업_${today()}.json`; el.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function dialog(html){ $('#dlgBody').innerHTML = html; $('#dlg').showModal(); }
function closeDlg(){ $('#dlg').close(); }
</script>
</body>
