<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>무플 관리자</title>
<style>
:root{--g:#1f6f4a;--g2:#e8f3ec;--ink:#1d2421;--mut:#6b746f;--line:#e3e7e4;--red:#c0392b;--amber:#b7791f;--bg:#f6f8f7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:4}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.big{font-size:22px;font-weight:800;text-align:right;min-width:56px}
.big small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;background:var(--g);color:#fff}
.btn.ghost{background:var(--g2);color:var(--g)}
.btn.red{background:#fbeaea;color:var(--red)}
.btn:disabled{opacity:.4}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--g2);color:var(--g);margin-left:6px;font-weight:600}
.tag.amber{background:#fdf3e1;color:var(--amber)}
.tag.red{background:#fbeaea;color:var(--red)}
.tag.gray{background:#eee;color:#777}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.center{text-align:center;padding:40px 16px}
.hint{font-size:13px;color:var(--mut);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hist{font-size:14px;max-height:240px;overflow:auto;margin-top:8px}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>무플 관리자</h1><button id="btnOut" class="hidden">로그아웃</button></header>
<nav id="nav" class="hidden">
  <button data-t="check" class="on">출석</button>
  <button data-t="members">회원·이용권</button>
  <button data-t="log">기록</button>
  <button data-t="more">설정</button>
</nav>
<main id="app"><div class="center">불러오는 중…</div></main>
<div class="toast" id="toast"></div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script type="module">
const ADMIN_EMAIL = 'rlaehgus114@gmail.com';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysSince = s => s ? Math.floor((new Date(today()) - new Date(s)) / 86400000) : null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- 1. Firebase 설정 (이 기기 브라우저에만 저장) ---------- */
// 웹용 Firebase 설정값 (공개용 식별값 — 데이터 접근은 보안 규칙으로 관리자 계정만 허용)
const DEFAULT_CFG = {
  apiKey: 'AIzaSyAgRa8fj3qJG9SWM_Gyeml_lay6y91HKC8',
  authDomain: 'moveplay-suncheon.firebaseapp.com',
  projectId: 'moveplay-suncheon',
  storageBucket: 'moveplay-suncheon.firebasestorage.app',
  messagingSenderId: '321589961889',
  appId: '1:321589961889:web:2282627a7b966d9109fce0'
};
let cfg = DEFAULT_CFG;
try { cfg = JSON.parse(localStorage.getItem('mp_fb_cfg') || 'null') || DEFAULT_CFG; } catch(e) {}
if (!cfg) { setupScreen(); } else { boot(cfg).catch(e => { app.innerHTML = `<div class="card">시작 오류: ${esc(e.message)}<br><br><button class="btn ghost" id="reset">설정 다시 입력</button></div>`; $('#reset').onclick = () => { try{localStorage.removeItem('mp_fb_cfg')}catch(e){} location.reload(); }; }); }

function setupScreen(){
  app.innerHTML = `<div class="card"><div class="name">처음 한 번만 설정</div>
  <p class="hint">Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에 있는 <b>firebaseConfig</b> 부분을 통째로 복사해서 아래에 붙여넣으세요.<br>이 값은 이 기기 브라우저에만 저장돼요.</p>
  <textarea id="cfgIn" rows="9" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ... };"></textarea>
  <div style="margin-top:10px"><button class="btn" id="cfgSave">저장하고 시작</button></div></div>`;
  $('#cfgSave').onclick = () => {
    const raw = $('#cfgIn').value;
    const o = {};
    raw.replace(/(\w+)\s*:\s*["']([^"']+)["']/g, (_, k, v) => { o[k] = v; });
    if (!o.apiKey || !o.projectId) return toast('apiKey, projectId 가 안 보여요. 다시 복사해 주세요.');
    try { localStorage.setItem('mp_fb_cfg', JSON.stringify(o)); } catch(e) { return toast('이 브라우저는 저장이 막혀 있어요.'); }
    location.reload();
  };
}

/* ---------- 2. 시작 ---------- */
let fb, db, auth, state = { passes: [], logs: [], tab: 'check', filter: '전체', q: '' };

async function boot(cfg){
  const [{ initializeApp }, A, F] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  fb = { ...A, ...F };
  const fapp = initializeApp(cfg);
  auth = A.getAuth(fapp);
  db = F.getFirestore(fapp);
  A.onAuthStateChanged(auth, async user => {
    if (!user) return loginScreen();
    if (user.email !== ADMIN_EMAIL) { app.innerHTML = `<div class="center">관리자 계정이 아니에요 (${esc(user.email)})<br><br><button class="btn ghost" id="o">다른 계정으로</button></div>`; $('#o').onclick = () => fb.signOut(auth); return; }
    $('#nav').classList.remove('hidden'); $('#btnOut').classList.remove('hidden');
    $('#btnOut').onclick = () => fb.signOut(auth).then(() => location.reload());
    await loadAll(); render();
  });
}

function loginScreen(){
  $('#nav').classList.add('hidden'); $('#btnOut').classList.add('hidden');
  app.innerHTML = `<div class="center"><p class="hint">관리자 구글 계정으로 로그인하세요.</p><button class="btn" id="li">구글로 로그인</button></div>`;
  $('#li').onclick = () => fb.signInWithPopup(auth, new fb.GoogleAuthProvider()).catch(e => toast('로그인 실패: ' + e.code));
}

async function loadAll(){
  const ps = await fb.getDocs(fb.collection(db, 'passes'));
  state.passes = ps.docs.map(d => ({ id: d.id, ...d.data() }));
  const since = new Date(); since.setDate(since.getDate() - 120);
  const ls = await fb.getDocs(fb.query(fb.collection(db, 'attendance'), fb.where('date', '>=', since.toISOString().slice(0, 10)), fb.orderBy('date', 'desc'), fb.limit(500)));
  state.logs = ls.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ---------- 계산 ---------- */
const used = p => (p.usedBefore || 0) + (p.usedAfter || 0);
const left = p => (p.total || 0) - used(p);
function status(p){
  if (p.archived) return ['만료', 'gray'];
  if (p.kind === '금액권') return ['금액권', 'gray'];
  const l = left(p), d = daysSince(p.lastDate);
  if (l <= 0) return ['재등록 안내', 'red'];
  if (l <= 3) return ['곧 소진', 'amber'];
  if (d !== null && d >= 21) return ['연락 필요', 'amber'];
  return ['정상', ''];
}

/* ---------- 화면 ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  state.tab = b.dataset.t; render();
});

function render(){ ({ check: renderCheck, members: renderMembers, log: renderLog, more: renderMore })[state.tab](); window.scrollTo(0, 0); }

function passList(list, withBtn){
  if (!list.length) return `<div class="center hint">해당하는 회원이 없어요</div>`;
  return list.map(p => { const [s, c] = status(p); return `
  <div class="card"><div class="row">
    <div class="grow" data-open="${p.id}" style="cursor:pointer">
      <div class="name">${esc(p.name)}<span class="tag ${c}">${s}</span></div>
      <div class="sub">${esc(p.cls)} · ${esc(p.label || '')}${p.lastDate ? ' · 마지막 ' + esc(p.lastDate.slice(5)) : ''}</div>
    </div>
    ${p.kind === '금액권' ? '' : `<div class="big">${left(p)}<small>남음 / ${p.total}</small></div>`}
    ${withBtn && p.kind !== '금액권' ? `<button class="btn" data-ck="${p.id}" ${left(p) <= 0 ? 'disabled' : ''}>출석</button>` : ''}
  </div></div>`; }).join('');
}

function bindList(){
  app.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => checkIn(b.dataset.ck, $('#ckDate')?.value || today()));
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openPass(b.dataset.open));
}

function filtered(){
  const q = state.q.trim();
  return state.passes.filter(p => !p.archived)
    .filter(p => state.filter === '전체' || p.cls.includes(state.filter))
    .filter(p => !q || p.name.includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
}

function renderCheck(){
  const done = new Set(state.logs.filter(l => l.date === today()).map(l => l.passId));
  app.innerHTML = `
  <div class="toolbar"><input id="q" placeholder="이름 검색" value="${esc(state.q)}"><input id="ckDate" type="date" value="${today()}" style="max-width:150px"></div>
  <div class="chips">${['전체', '1:1', '2:1', '그룹'].map(f => `<button data-f="${f}" class="${state.filter === f ? 'on' : ''}">${f}</button>`).join('')}</div>
  <p class="hint">오늘 출석 ${done.size}명 · 이름을 누르면 상세 기록</p>
  ${passList(filtered(), true)}`;
  $('#q').oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; renderCheck(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { state.filter = b.dataset.f; renderCheck(); });
  app.querySelectorAll('[data-ck]').forEach(b => { if (done.has(b.dataset.ck)) { b.textContent = '완료'; b.classList.add('ghost'); } });
  bindList();
}

function renderMembers(){
  const act = state.passes.filter(p => !p.archived);
  const need = act.filter(p => status(p)[0] !== '정상' && p.kind !== '금액권');
  app.innerHTML = `
  <div class="toolbar"><button class="btn" id="add">+ 새 이용권</button></div>
  <div class="name" style="margin:6px 0">챙겨야 할 회원 ${need.length}명</div>
  ${passList(need.sort((a, b) => left(a) - left(b)), false)}
  <div class="name" style="margin:16px 0 6px">전체 이용권 ${act.length}개</div>
  ${passList(act.sort((a, b) => a.name.localeCompare(b.name, 'ko')), false)}
  <details style="margin-top:16px"><summary class="hint">만료된 이용권 보기</summary>${passList(state.passes.filter(p => p.archived), false)}</details>`;
  $('#add').onclick = () => editPass(null);
  bindList();
}

function renderLog(){
  const byId = Object.fromEntries(state.passes.map(p => [p.id, p]));
  const groups = {};
  state.logs.forEach(l => (groups[l.date] = groups[l.date] || []).push(l));
  app.innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([d, ls]) => `
    <div class="card"><div class="name">${esc(d)} <span class="tag">${ls.length}명</span></div>
    ${ls.map(l => `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="grow">${esc(byId[l.passId]?.name || l.name)} <span class="sub">${esc(byId[l.passId]?.cls || '')}</span></div><button class="btn red" data-undo="${l.id}" style="padding:6px 10px;font-size:13px">취소</button></div>`).join('')}
    </div>`).join('') : `<div class="center hint">아직 이 앱에서 찍은 출석이 없어요.<br>기존 기록은 '사용' 횟수에 합쳐져 있어요.</div>`;
  app.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => undo(b.dataset.undo));
}

function renderMore(){
  app.innerHTML = `
  <div class="card"><div class="name">기존 시트 데이터 가져오기</div>
    <p class="hint">받은 <b>무플_가져오기.json</b> 파일을 선택하세요. 처음 한 번만 하면 돼요.</p>
    <input type="file" id="imp" accept=".json,application/json"></div>
  <div class="card"><div class="name">백업 내려받기</div>
    <p class="hint">이용권과 출석 기록 전체를 파일로 저장해요. 한 달에 한 번 받아 두세요.</p>
    <button class="btn ghost" id="bak">백업 파일 받기</button></div>
  <div class="card"><div class="name">이 기기 설정 지우기</div>
    <p class="hint">다른 사람 기기에서 썼다면 눌러 주세요.</p>
    <button class="btn red" id="rst">설정 지우고 로그아웃</button></div>`;
  $('#imp').onchange = e => importFile(e.target.files[0]);
  $('#bak').onclick = backup;
  $('#rst').onclick = async () => { try{localStorage.removeItem('mp_fb_cfg')}catch(e){} await fb.signOut(auth); location.reload(); };
}

/* ---------- 동작 ---------- */
async function checkIn(passId, date){
  const p = state.passes.find(x => x.id === passId);
  if (state.logs.some(l => l.passId === passId && l.date === date) && !confirm(`${p.name}님은 ${date}에 이미 출석했어요. 한 번 더 찍을까요?`)) return;
  const ref = fb.doc(fb.collection(db, 'attendance'));
  const batch = fb.writeBatch(db);
  batch.set(ref, { passId, name: p.name, date, createdAt: fb.serverTimestamp() });
  const newLast = !p.lastDate || date > p.lastDate ? date : p.lastDate;
  batch.update(fb.doc(db, 'passes', passId), { usedAfter: fb.increment(1), lastDate: newLast });
  await batch.commit();
  p.usedAfter = (p.usedAfter || 0) + 1; p.lastDate = newLast;
  state.logs.unshift({ id: ref.id, passId, name: p.name, date });
  toast(`${p.name}님 출석 · 남은 ${left(p)}회`);
  render();
}

async function undo(logId){
  const l = state.logs.find(x => x.id === logId); if (!l) return;
  if (!confirm(`${l.name}님 ${l.date} 출석을 취소할까요?`)) return;
  const p = state.passes.find(x => x.id === l.passId);
  const batch = fb.writeBatch(db);
  batch.delete(fb.doc(db, 'attendance', logId));
  const rest = state.logs.filter(x => x.passId === l.passId && x.id !== logId).map(x => x.date).sort();
  const newLast = rest.length ? rest[rest.length - 1] : (p.importedLast || p.lastDate);
  if (p) batch.update(fb.doc(db, 'passes', p.id), { usedAfter: fb.increment(-1), lastDate: newLast || null });
  await batch.commit();
  if (p) { p.usedAfter = (p.usedAfter || 0) - 1; p.lastDate = newLast; }
  state.logs = state.logs.filter(x => x.id !== logId);
  toast('취소했어요'); render();
}

async function openPass(id){
  const p = state.passes.find(x => x.id === id);
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'attendance'), fb.where('passId', '==', id)));
  const ds = snap.docs.map(d => d.data().date).sort().reverse();
  const [s, c] = status(p);
  dialog(`
    <div class="name">${esc(p.name)}<span class="tag ${c}">${s}</span></div>
    <div class="sub">${esc(p.cls)} · ${esc(p.label || '')}</div>
    <p>등록 <b>${p.total}</b>회 · 사용 <b>${used(p)}</b>회 (시트에서 옮긴 ${p.usedBefore || 0} + 앱 ${p.usedAfter || 0}) · <b>남음 ${left(p)}</b>회</p>
    ${p.note ? `<p class="hint">메모: ${esc(p.note)}</p>` : ''}
    <div class="name" style="font-size:14px">앱 출석 기록 ${ds.length}회</div>
    <div class="hist">${ds.map(d => `<div><span>${esc(d)}</span></div>`).join('') || '<p class="hint">아직 없음</p>'}</div>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="btn ghost" id="ed">수정</button>
      <button class="btn ghost" id="rn">재등록</button>
      <button class="btn red" id="ar">${p.archived ? '되살리기' : '만료 처리'}</button>
      <span class="grow"></span><button class="btn" id="cl">닫기</button>
    </div>`);
  $('#cl').onclick = closeDlg;
  $('#ed').onclick = () => editPass(p);
  $('#rn').onclick = () => editPass({ name: p.name, cls: p.cls, phone4: p.phone4 || '', _renew: p.id });
  $('#ar').onclick = async () => { await fb.updateDoc(fb.doc(db, 'passes', id), { archived: !p.archived }); p.archived = !p.archived; closeDlg(); render(); };
}

function editPass(p){
  const isNew = !p || !p.id;
  p = p || { cls: '1:1 PT' };
  dialog(`
    <div class="name">${isNew ? (p._renew ? '재등록' : '새 이용권') : '이용권 수정'}</div>
    <label>이름</label><input id="f_name" value="${esc(p.name || '')}">
    <label>수업</label><select id="f_cls">${['1:1 PT', '2:1 PT', '그룹 PT', '1:1 PT,그룹 PT'].map(v => `<option ${p.cls === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <label>이용권 이름 (예: 재등록 8회, 오전 케틀벨반 24회)</label><input id="f_label" value="${esc(p.label || '')}">
    <label>등록 횟수</label><input id="f_total" type="number" inputmode="numeric" value="${p.total ?? ''}">
    ${isNew ? '' : `<label>시트에서 옮긴 사용 횟수 (보정용)</label><input id="f_ub" type="number" inputmode="numeric" value="${p.usedBefore || 0}">`}
    <label>전화 뒷자리</label><input id="f_p4" inputmode="numeric" maxlength="4" value="${esc(p.phone4 || '')}">
    <label>메모</label><input id="f_note" value="${esc(p.note || '')}">
    ${p._renew ? '<p class="hint">저장하면 이전 이용권은 자동으로 만료 처리돼요.</p>' : ''}
    <div class="row" style="margin-top:14px;gap:8px"><span class="grow"></span><button class="btn ghost" id="cn">취소</button><button class="btn" id="sv">저장</button></div>`);
  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    const d = { name: $('#f_name').value.trim(), cls: $('#f_cls').value, label: $('#f_label').value.trim(),
      total: +$('#f_total').value || 0, phone4: $('#f_p4').value.trim(), note: $('#f_note').value.trim() };
    if (!d.name || !d.total) return toast('이름과 등록 횟수를 넣어 주세요');
    if (isNew) {
      const ref = await fb.addDoc(fb.collection(db, 'passes'), { ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false, startDate: today(), createdAt: fb.serverTimestamp() });
      state.passes.push({ id: ref.id, ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false });
      if (p._renew) { await fb.updateDoc(fb.doc(db, 'passes', p._renew), { archived: true }); state.passes.find(x => x.id === p._renew).archived = true; }
    } else {
      d.usedBefore = +$('#f_ub').value || 0;
      await fb.updateDoc(fb.doc(db, 'passes', p.id), d);
      Object.assign(p, d);
    }
    closeDlg(); toast('저장했어요'); render();
  };
}

async function importFile(file){
  if (!file) return;
  let rows; try { rows = JSON.parse(await file.text()); } catch (e) { return toast('파일을 읽을 수 없어요'); }
  if (state.passes.length && !confirm(`이미 이용권이 ${state.passes.length}개 있어요. 그래도 추가할까요? (중복될 수 있어요)`)) return;
  const batch = fb.writeBatch(db);
  rows.forEach(r => batch.set(fb.doc(fb.collection(db, 'passes')), {
    name: r.name, cls: r.cls, label: r.label || '', kind: r.kind || '', total: r.total || 0,
    usedBefore: r.used || 0, usedAfter: 0, lastDate: r.lastDate || null, importedLast: r.lastDate || null,
    phone4: r.phone4 || '', note: r.note || '', archived: !!r.archived, startDate: null, createdAt: fb.serverTimestamp()
  }));
  await batch.commit();
  await loadAll(); toast(`${rows.length}개 가져왔어요`); state.tab = 'members';
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'members')); render();
}

async function backup(){
  const a = await fb.getDocs(fb.collection(db, 'attendance'));
  const data = { exportedAt: new Date().toISOString(), passes: state.passes, attendance: a.docs.map(d => ({ id: d.id, ...d.data(), createdAt: null })) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  const el = document.createElement('a'); el.href = url; el.download = `무플_백업_${today()}.json`; el.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function dialog(html){ $('#dlgBody').innerHTML = html; $('#dlg').showModal(); }
function closeDlg(){ $('#dlg').close(); }
</script>
