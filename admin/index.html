<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>무플 관리자</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 관리자 앱: 휴대폰은 위 제목줄 + 아래 탭, 넓은 화면은 왼쪽 메뉴. 목록은 한 장의 면 위에 줄로 나눠 빠르게 훑기. */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --sunk:#eef2e8; --ink:#1b2316; --mut:#5f6b57; --line:#e2e8da;
  --brand:#6eb92b; --on-brand:#10200a; --g:#2f6b12; --g2:#e6f2d9;
  --red:#b3261e; --red2:#fbe9e6; --amber:#8a5300; --amber2:#fcf0d9; --blue:#2f56b0; --blue2:#e8eefb;
  --scrim:rgba(10,16,8,.45); --shadow:0 12px 32px -16px rgba(27,35,22,.35);
  --f-display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bar:56px; --side:220px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11160e; --surface:#192015; --sunk:#141a10; --ink:#e8eee0; --mut:#a3ae99; --line:#2b3525;
  --brand:#86cf45; --on-brand:#0e1a08; --g:#b6e58c; --g2:#223218;
  --red:#ff8f86; --red2:#3a1d1a; --amber:#f0b45a; --amber2:#382912; --blue:#a9c0ff; --blue2:#1c2540;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -16px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11160e; --surface:#192015; --sunk:#141a10; --ink:#e8eee0; --mut:#a3ae99; --line:#2b3525;
  --brand:#86cf45; --on-brand:#0e1a08; --g:#b6e58c; --g2:#223218;
  --red:#ff8f86; --red2:#3a1d1a; --amber:#f0b45a; --amber2:#382912; --blue:#a9c0ff; --blue2:#1c2540;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -16px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;word-break:keep-all}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 위 제목줄 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;height:var(--bar);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-left:var(--gl);padding-right:var(--gr)}
.bar img{width:22px;height:auto}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .app{font-size:12px;color:var(--mut);font-weight:700;margin-left:6px;font-family:var(--f-body)}
.bar-d{font:500 13px var(--f-mono);color:var(--mut)}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 아래 탭 (휴대폰) */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;border-radius:12px;position:relative}
#nav button.on{color:var(--g)}
#nav button.on svg{stroke-width:2.4}
#nav button.on::before{content:"";position:absolute;top:-5px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
main{max-width:760px;margin:0 auto;padding:16px var(--gr) calc(96px + env(safe-area-inset-bottom,0px)) var(--gl)}

/* 넓은 화면: 왼쪽 메뉴 */
@media (min-width:960px){
  body.in{padding-left:var(--side)}
  body.in .bar{margin-left:calc(-1 * var(--side));padding-left:24px}
  #nav{top:calc(var(--bar) + env(safe-area-inset-top,0px));right:auto;width:var(--side);display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
  #nav button{flex-direction:row;gap:12px;padding:11px 14px;font-size:15px}
  #nav button:hover{background:var(--sunk);color:var(--ink)}
  #nav button.on{background:var(--g2)}
  #nav button.on::before{top:10px;bottom:10px;left:-12px;width:3px;height:auto;border-radius:0 3px 3px 0}
  main{padding:28px 32px 56px}
}

/* 기본 부품 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.feat{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.card.attn{background:var(--amber2);border-color:transparent}
.attn-t{font-weight:800;color:var(--amber)}
.row{display:flex;align-items:center;gap:10px}
.row.g8{gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.name{font-weight:800;font-size:16px}
.card>.name{margin-bottom:4px}
.sub{color:var(--mut);font-size:13px}
.hint{font-size:13px;color:var(--mut);line-height:1.65;margin:6px 0 10px}
.t-red{color:var(--red)}.t-mut{color:var(--mut);font-weight:500}.t-ink{color:var(--ink)}.t-amber{color:var(--amber)}.t-g{color:var(--g)}
.sec{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:800;color:var(--mut);margin:22px 4px 10px}
.sec span{font:500 13px var(--f-mono)}
.sec-row{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-row .sec{margin:0 4px;flex:1}
main>.sec:first-child,main>.sec-row:first-child{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:12px;font-size:15px;font-weight:800;background:var(--brand);color:var(--on-brand);cursor:pointer;white-space:nowrap;transition:filter .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:var(--g2);color:var(--g)}
.btn.red{background:var(--red2);color:var(--red)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:44px;padding:0;font-size:20px}
.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.tag{display:inline-flex;align-items:center;font-size:11.5px;line-height:1;padding:4px 8px;border-radius:99px;background:var(--g2);color:var(--g);margin-left:6px;font-weight:800;white-space:nowrap;vertical-align:2px}
.tag.amber{background:var(--amber2);color:var(--amber)}
.tag.red{background:var(--red2);color:var(--red)}
.tag.gray{background:var(--sunk);color:var(--mut)}
.tag.blue{background:var(--blue2);color:var(--blue)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand)}
textarea{line-height:1.6;resize:vertical}
input[type=checkbox]{width:20px;min-height:0;height:20px;accent-color:var(--brand)}
input[type=file]{padding:9px;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 6px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input{flex:1;min-width:0}
.toolbar input[type=date]{flex:0 0 auto;width:auto;font-family:var(--f-mono);font-size:15px}
.toolbar.sticky{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:5;margin:-16px calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:12px var(--gr) 8px var(--gl);background:var(--bg)}
@media (min-width:960px){.toolbar.sticky{margin:-28px -32px 0;padding:16px 32px 8px}}
.wk-t{flex:1;text-align:center;font-weight:800;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;min-height:34px;padding:0 14px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sumline{display:flex;align-items:center;gap:14px;margin:4px 4px 12px;color:var(--mut);font-size:14px}
.sumline b{font:600 22px var(--f-mono);color:var(--ink);margin-right:3px}
.sumline .grow{text-align:right}
.center{text-align:center;padding:48px 16px}
.empty{text-align:center;padding:28px 16px;color:var(--mut);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}

/* 회원 목록 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px}
.item+.item{border-top:1px solid var(--line)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer}
.who.static{cursor:default}
.who .nm{font-weight:800;font-size:16px;display:flex;align-items:center;flex-wrap:wrap;row-gap:4px}
.who .nm .tag:first-of-type{margin-left:8px}
.who .meta{font-size:13px;color:var(--mut);line-height:1.45}
button.who:hover .nm{color:var(--g)}
.cnt{text-align:right;flex:0 0 auto;min-width:52px}
.cnt b{display:block;font:600 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.cnt small{font:500 11px var(--f-mono);color:var(--mut)}
.cnt.money b{font-size:15px}
.cnt.low b{color:var(--amber)}.cnt.out b{color:var(--red)}
.item .btn{min-width:64px}
.who .meta.wrap{white-space:normal}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
ul.steps{padding-left:18px;margin-top:0}ul.steps li{margin:2px 0}
.card>:last-child{margin-bottom:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;min-height:38px;font-size:14px;font-weight:800;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .num{font-size:12px;margin-left:2px}
.slot-r.skipped{background:var(--sunk)}
.slot-r.skipped .grow{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.slot-r.skipped .sub{text-decoration:none;display:inline-block}
.card.cls .sub{margin-top:2px}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.roster span{background:var(--sunk);border-radius:99px;padding:5px 11px;font-size:14px;font-weight:700}
.roster span.warn{background:var(--red2);color:var(--red)}
.roster small{font-weight:600;font-size:11px;opacity:.85}
.sess{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.sess input[type=time]{width:auto;flex:1;min-width:110px;font-family:var(--f-mono)}
.wds{display:flex;gap:4px;flex-wrap:wrap}
.wds button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--mut);font-weight:800;font-size:14px;cursor:pointer}
.wds button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.today-h{display:flex;flex-direction:column;gap:6px;margin:4px 4px 6px}
.td-date{font-family:var(--f-display);font-size:30px;line-height:1.1;letter-spacing:.01em}
.td-sum{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:14px}
.td-sum b{font-size:18px;color:var(--ink);margin-right:2px}
.item.todo{position:relative}
.item.todo::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.item.todo.amber::before{background:var(--amber)}.item.todo.red::before{background:var(--red)}
.more-row{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;font-size:14px;font-weight:800;color:var(--g);cursor:pointer}
.who .tm{font-weight:600;margin-right:8px}
.who .meta i{font-style:normal}
.who .meta i.ok{color:var(--g);font-weight:800}
.who .meta i.no{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.sec.now{color:var(--g)}
.item.skipped{background:var(--sunk)}
#dlg .list{margin-bottom:4px}
#dlg .sec-row{margin:20px 0 8px}
details.more-list{margin-top:18px}
details.more-list summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--mut);padding:8px 4px;list-style:none}
details.more-list summary::before{content:"＋ "}
details.more-list[open] summary::before{content:"－ "}

/* 예약 */
.slot{padding:0;overflow:hidden}
.slot-h{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px}
.slot-h .time{font:600 20px var(--f-mono);margin-right:8px}
.slot-r{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 16px;border-top:1px solid var(--line)}
.slot-r .sub{margin-left:4px}

/* 대화상자: 휴대폰은 아래에서 올라오는 시트 */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:100%;max-height:92vh;max-height:92dvh;margin:auto 0 0;border-radius:22px 22px 0 0;box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
#dlgBody{padding:10px var(--gr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gl)}
#dlgBody::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#dlgBody>.name:first-child,#dlgBody>.row:first-child .name{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.25;letter-spacing:.01em}
@media (min-width:640px){
  dialog{width:min(92vw,540px);margin:auto;border-radius:20px;max-height:88vh}
  #dlgBody{padding:24px}
  #dlgBody::before{display:none}
}
.acts{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px calc(-1 * var(--gr)) calc(-16px - env(safe-area-inset-bottom,0px)) calc(-1 * var(--gl));padding:12px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);border-top:1px solid var(--line)}
@media (min-width:640px){.acts{margin:22px -24px -24px;padding:14px 24px}}
.stack{display:grid;gap:10px;margin-top:12px}
.stack .btn{min-height:56px;font-size:17px}
.picks{max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;margin-top:8px}
label.pick{display:flex;align-items:center;gap:12px;margin:0;padding:11px 12px;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}
label.pick+label.pick{border-top:1px solid var(--line)}
.hist{font-size:14px;max-height:240px;overflow:auto;margin-top:6px}
.hist div{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:13px}

/* 운동 기록·계획 */
.wk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px;background:var(--surface)}
.wk.soft{background:var(--sunk)}
.wk.hl{border-color:var(--brand);background:var(--g2)}
.wk .d{font-weight:800;color:var(--g);display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk ul{margin:8px 0 0;padding-left:18px}.wk li{margin:3px 0}
.wk .hw{margin-top:8px;color:var(--amber);background:var(--amber2);border-radius:8px;padding:6px 10px;font-weight:700}
.wk-meta{margin-top:6px;font-size:13px;color:var(--g);font-weight:800}
.prog{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.ms{margin-bottom:6px}.ms-n{flex:0 0 40%;font-size:14px}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipset button{border:0;background:var(--g2);color:var(--g);border-radius:99px;min-height:34px;padding:0 12px;font-size:14px;font-weight:700;cursor:pointer}
.card.attn .chipset button{background:var(--surface);color:var(--amber)}

/* 로그인 */
.login{max-width:360px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.login img{width:48px;height:auto;margin-bottom:8px}
.login h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}
.login .btn{margin-top:14px;width:100%}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:32px;left:calc(50% + var(--side) / 2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script type="module">
const ADMIN_EMAIL = 'rlaehgus114@gmail.com';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysSince = s => s ? Math.floor((new Date(today()) - new Date(s)) / 86400000) : null;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const wdOf = s => new Date(s + 'T00:00:00Z').getUTCDay();
const fmtDay = s => `${+s.slice(5, 7)}/${+s.slice(8)}(${WD[wdOf(s)]})`;
// 반이 하나도 없을 때 처음 한 번 만드는 기본 시간표 (요일 번호: 0=일 ~ 6=토)
// 이후 시간표·정원·명단은 앱의 예약 → 반 관리에서 바꿔요
const SEED_CLASSES = [
  { id: 'kettlebell', name: '케틀벨 그룹 PT', kind: 'group', cap: 6, sessions: [{ wd: 2, time: '10:00' }, { wd: 5, time: '10:00' }] },
  { id: 'moveon-wed18', name: 'Move ON', kind: 'group', cap: 6, sessions: [{ wd: 3, time: '18:00' }] },
  { id: 'moveon-wed19', name: 'Move ON', kind: 'group', cap: 6, sessions: [{ wd: 3, time: '19:00' }] },
  { id: 'moveon-wed20', name: 'Move ON', kind: 'group', cap: 6, sessions: [{ wd: 3, time: '20:00' }] },
  { id: 'swing-sat10', name: '스윙·겟업', kind: 'group', cap: 6, sessions: [{ wd: 6, time: '10:00' }] },
  { id: 'moveon-sat11', name: 'Move ON', kind: 'group', cap: 6, sessions: [{ wd: 6, time: '11:00' }] },
  { id: 'moveon-sat12', name: 'Move ON', kind: 'group', cap: 6, sessions: [{ wd: 6, time: '12:00' }] },
];
const HORIZON = 28;  // 반 명단으로 며칠 앞까지 예약을 채울지
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- 1. Firebase 설정 (이 기기 브라우저에만 저장) ---------- */
// 웹용 Firebase 설정값 (공개용 식별값 — 데이터 접근은 보안 규칙으로 관리자 계정만 허용)
const DEFAULT_CFG = {
  apiKey: 'AIzaSyAgRa8fj3qJG9SWM_Gyeml_lay6y91HKC8',
  authDomain: 'moveplay-suncheon.firebaseapp.com',
  projectId: 'moveplay-suncheon',
  storageBucket: 'moveplay-suncheon.firebasestorage.app',
  messagingSenderId: '321589961889',
  appId: '1:321589961889:web:2282627a7b966d9109fce0'
};
let cfg = DEFAULT_CFG;
try { cfg = JSON.parse(localStorage.getItem('mp_fb_cfg') || 'null') || DEFAULT_CFG; } catch(e) {}
boot(cfg).catch(e => { app.innerHTML = `<div class="card"><div class="name">시작하지 못했어요</div><p class="hint">${esc(e.message)}<br>인터넷 연결을 확인하고 새로고침해 주세요.</p><button class="btn ghost" id="reset">이 기기 설정 지우고 다시 시작</button></div>`; $('#reset').onclick = () => { try{localStorage.removeItem('mp_fb_cfg')}catch(e){} location.reload(); }; });
// 저장이 실패해도 조용히 멈추지 않게 알려 주기
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요'); });

/* ---------- 2. 시작 ---------- */
let fb, db, auth, state = { passes: [], logs: [], books: [], classes: [], schedView: 'week', memView: 'list', week: null, tab: 'today', filter: '전체', q: '', bookDate: null, ckDate: null };
const ckDay = () => state.ckDate || today();
const dayLbl = s => /^\d{4}-\d\d-\d\d$/.test(s || '') ? fmtDay(s) : String(s || '').slice(5);

async function boot(cfg){
  const [{ initializeApp }, A, F] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  fb = { ...A, ...F };
  const fapp = initializeApp(cfg);
  auth = A.getAuth(fapp);
  db = F.getFirestore(fapp);
  A.onAuthStateChanged(auth, async user => {
    if (!user) return loginScreen();
    if (user.email !== ADMIN_EMAIL) { app.innerHTML = `<div class="login"><img src="${$('#logo').src}" alt=""><h2>관리자 계정이 아니에요</h2><p class="hint">${esc(user.email)}</p><button class="btn ghost" id="o">다른 계정으로 로그인</button></div>`; $('#o').onclick = () => fb.signOut(auth); return; }
    document.body.classList.add('in'); $('#barD').textContent = fmtDay(today());
    $('#nav').classList.remove('hidden'); $('#btnOut').classList.remove('hidden');
    $('#btnOut').onclick = () => fb.signOut(auth).then(() => location.reload());
    await loadAll(); render();
  });
}

function loginScreen(){
  document.body.classList.remove('in'); $('#pgT').textContent = '무플 관리자';
  $('#nav').classList.add('hidden'); $('#btnOut').classList.add('hidden');
  app.innerHTML = `<div class="login"><img src="${$('#logo').src}" alt=""><h2>무플 관리자</h2><p class="hint">무브앤플레이 순천점 관리자 구글 계정으로 로그인하세요.</p><button class="btn" id="li">구글로 로그인</button></div>`;
  $('#li').onclick = () => fb.signInWithPopup(auth, new fb.GoogleAuthProvider()).catch(e => toast('로그인 실패: ' + e.code));
}

async function loadAll(){
  const cs = await fb.getDocs(fb.collection(db, 'classes'));
  state.classes = cs.docs.map(d => ({ id: d.id, ...d.data() }));
  const ps = await fb.getDocs(fb.collection(db, 'passes'));
  state.passes = ps.docs.map(d => ({ id: d.id, ...d.data() }));
  for (const p of state.passes) {
    if (isMoney(p) && p.balance == null && MONEY_INIT[p.name]) {
      await fb.updateDoc(fb.doc(db, 'passes', p.id), MONEY_INIT[p.name]); Object.assign(p, MONEY_INIT[p.name]);
    }
  }
  const since = new Date(); since.setDate(since.getDate() - 120);
  const ls = await fb.getDocs(fb.query(fb.collection(db, 'attendance'), fb.where('date', '>=', since.toISOString().slice(0, 10)), fb.orderBy('date', 'desc'), fb.limit(500)));
  state.logs = ls.docs.map(d => ({ id: d.id, ...d.data() }));
  const bs = await fb.getDocs(fb.query(fb.collection(db, 'bookings'), fb.where('date', '>=', addDays(today(), -7))));
  state.books = bs.docs.map(d => ({ id: d.id, ...d.data() }));
  if (!state.classes.length) await seedClasses();
  await syncAuto();
  state.loadedAt = Date.now();
}
// 다른 기기(센터 태블릿)에서 찍힌 출석도 보이도록, 앱으로 돌아오면 새로 불러오기
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !db || !auth?.currentUser) return;
  if (Date.now() - (state.loadedAt || 0) < 30000 || $('#dlg').open) return;
  await loadAll(); refresh();
});

/* ---------- 계산 ---------- */
const used = p => (p.usedBefore || 0) + (p.usedAfter || 0);
const left = p => (p.total || 0) - used(p);
const isMoney = p => p.kind === '금액권';
const moneyLeft = p => (p.balance || 0) - (p.spent || 0);
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
// 금액권 처음 설정값 (출석관리 시트 '금액권' 탭 2026-10-31 기준)
const MONEY_INIT = { '한가려': { balance: 465000, priceP: 60000, priceG: 25000, spent: 0 } };
function status(p){
  if (p.archived) return ['만료', 'gray'];
  if (isMoney(p)) {
    const m = moneyLeft(p);
    if (m < Math.min(p.priceP || 0, p.priceG || 0) || m <= 0) return ['충전 안내', 'red'];
    if (m < (p.priceP || 0) * 2) return ['곧 소진', 'amber'];
    const d = daysSince(p.lastDate);
    if (d !== null && d >= 21) return ['연락 필요', 'amber'];
    return ['금액권', ''];
  }
  const l = left(p), d = daysSince(p.lastDate);
  if (l <= 0) return ['재등록 안내', 'red'];
  if (l <= 3) return ['곧 소진', 'amber'];
  if (d !== null && d >= 21) return ['연락 필요', 'amber'];
  return ['정상', ''];
}

/* ---------- 화면 ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = async () => {
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  state.tab = b.dataset.t;
  if (['today', 'members'].includes(state.tab) && Date.now() - (state.loadedAt || 0) > 30000) await loadAll();
  render();
});

const TITLES = { today: '오늘', sched: '시간표', members: '회원', more: '설정' };
// 탭을 바꿀 땐 맨 위로, 저장 뒤 다시 그릴 땐(refresh) 보던 자리 그대로
function refresh(){ $('#pgT').textContent = TITLES[state.tab]; document.title = TITLES[state.tab] + ' · 무플 관리자'; return ({ today: renderToday, sched: renderSched, members: renderMembers, more: renderMore })[state.tab](); }
function render(){ refresh(); window.scrollTo(0, 0); }

/* ---------- 반(정기 수업)과 자동 예약 ----------
   반에 회원을 한 번 넣어 두면 앱을 열 때마다 HORIZON일 앞까지 예약(bookings)을 채워요.
   자동 예약은 auto: true, classId 가 붙고 문서 id가 정해져 있어서(a_반_날짜_시간_이름) 여러 기기에서 열어도 겹치지 않아요.
   빠지는 날은 반의 skips 에 적어 두고 그 예약만 지워요. 알림톡 스크립트는 예전처럼 bookings 만 읽으면 돼요. */
const actClasses = () => state.classes.filter(c => c.active !== false);
const skipKey = (date, time, name) => `${date}|${time}|${name}`;
const autoId = (c, date, time, name) => `a_${c.id}_${date}_${time.replace(':', '')}_${name}`;
function classSlotsOn(date){
  const wd = wdOf(date);
  return actClasses().flatMap(c => (c.sessions || []).filter(s => s.wd === wd).map(s => ({ c, time: s.time })))
    .sort((a, b) => a.time.localeCompare(b.time) || a.c.name.localeCompare(b.c.name, 'ko'));
}
// 화·금 10:00 처럼 보여 주기
function sessLbl(c){
  const byT = {};
  (c.sessions || []).forEach(s => (byT[s.time] = byT[s.time] || []).push(s.wd));
  return Object.entries(byT).sort().map(([t, ws]) => ws.sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(w => WD[w]).join('·') + ' ' + t).join(' / ') || '시간 없음';
}
function pickPass(name, kind){
  const ps = state.passes.filter(p => !p.archived && p.name === name);
  const fit = p => isMoney(p) || (kind === 'pt' ? isPT(p) : /그룹/.test(p.cls || ''));
  const has = p => isMoney(p) ? moneyLeft(p) > 0 : left(p) > 0;
  return ps.find(p => fit(p) && has(p)) || ps.find(fit) || ps.find(has) || ps[0] || null;
}
function wantedAuto(){
  const out = new Map();
  for (let i = 1; i <= HORIZON; i++) {
    const d = addDays(today(), i);
    for (const { c, time } of classSlotsOn(d))
      for (const r of c.roster || []) {
        if ((r.from || '') > d) continue;
        if ((c.skips || []).includes(skipKey(d, time, r.name))) continue;
        out.set(autoId(c, d, time, r.name), { c, date: d, time, name: r.name });
      }
  }
  return out;
}
let syncing = null;
async function syncAuto(){
  if (syncing) return syncing;
  syncing = (async () => {
    const want = wantedAuto(), from = addDays(today(), 1);
    const have = new Map(state.books.filter(b => b.auto).map(b => [b.id, b]));
    const ops = [], added = [], removed = new Set();
    for (const [id, w] of want) {
      if (have.has(id)) continue;
      // 같은 날 같은 시간에 손으로 넣은 예약이 있으면 그대로 두기
      if (state.books.some(b => !b.auto && b.date === w.date && b.time === w.time && b.name === w.name)) continue;
      const p = pickPass(w.name, w.c.kind); if (!p) continue;
      const doc = { date: w.date, time: w.time, passId: p.id, name: w.name, cls: p.cls || '', slot: w.c.name, classId: w.c.id, auto: true, notified: false, createdAt: fb.serverTimestamp() };
      ops.push(b => b.set(fb.doc(db, 'bookings', id), doc)); added.push({ id, ...doc });
    }
    // 명단에서 빠졌거나 시간이 바뀐 반의 앞날 예약은 지우기 (이미 알림이 나간 건 남겨 둠)
    for (const [id, b] of have) if (b.date >= from && !want.has(id) && !b.notified) { ops.push(x => x.delete(fb.doc(db, 'bookings', id))); removed.add(id); }
    for (let i = 0; i < ops.length; i += 400) { const batch = fb.writeBatch(db); ops.slice(i, i + 400).forEach(f => f(batch)); await batch.commit(); }
    state.books = state.books.filter(b => !removed.has(b.id)).concat(added);
    return { added: added.length, removed: removed.size };
  })();
  try { return await syncing; } finally { syncing = null; }
}
// 최근 4주 예약 기록에서 이 반 시간에 2번 이상 온 회원
async function recentRegulars(c){
  const bs = await fb.getDocs(fb.query(fb.collection(db, 'bookings'), fb.where('date', '>=', addDays(today(), -28))));
  const cnt = {};
  bs.docs.map(d => d.data()).filter(b => b.date <= today() && (c.sessions || []).some(s => s.wd === wdOf(b.date) && s.time === b.time) && (b.classId ? b.classId === c.id : (b.slot || '') === c.name))
    .forEach(b => { cnt[b.name] = (cnt[b.name] || 0) + 1; });
  return Object.entries(cnt).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
}
// 처음 한 번: 기본 시간표로 반을 만들고, 최근 4주 예약으로 명단을 채워요
async function seedClasses(){
  const batch = fb.writeBatch(db), out = [], from = addDays(today(), 1);
  for (const { id, ...c } of SEED_CLASSES) {
    const reg = await recentRegulars({ id, ...c });
    const d = { ...c, roster: reg.map(([name]) => ({ name, from })), skips: [], active: true, createdAt: fb.serverTimestamp() };
    batch.set(fb.doc(db, 'classes', id), d); out.push({ id, ...d });
  }
  await batch.commit(); state.classes = out;
}

/* ---------- 시간표: 예약(누가)과 계획(무엇을)과 수업 기록을 수업 하나로 ---------- */
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const koSort = (a, b) => a.localeCompare(b, 'ko');
const segHtml = () => `<div class="seg" role="tablist"><button data-bv="week" class="${state.schedView === 'week' ? 'on' : ''}">주간 시간표</button><button data-bv="classes" class="${state.schedView === 'classes' ? 'on' : ''}">반 관리 <span class="num">${actClasses().length}</span></button></div>`;
const bindSeg = () => app.querySelectorAll('[data-bv]').forEach(b => b.onclick = () => { state.schedView = b.dataset.bv; render(); });
async function loadWeekPlans(wk){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'plans'), fb.where('week', '==', wk)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function weekBooks(wk){
  if (wk >= addDays(today(), -7)) return state.books;
  const q = await fb.getDocs(fb.query(fb.collection(db, 'bookings'), fb.where('date', '>=', wk), fb.where('date', '<=', addDays(wk, 6))));
  return q.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function weekGroupLogs(wk){
  const q = await fb.getDocs(fb.query(fb.collection(db, 'groupWorkouts'), fb.where('date', '>=', wk), fb.where('date', '<=', addDays(wk, 6))));
  return q.docs.map(d => ({ id: d.id, ...d.data() }));
}
// 날짜 하나의 수업들: 반 시간표 + 반에 안 묶인 예약(개인 PT 등)
function sessionsOn(date, books = state.books){
  const list = books.filter(b => b.date === date);
  const out = classSlotsOn(date).map(({ c, time }) => ({ key: `${c.id}|${time}`, c, time, bs: list.filter(b => b.time === time && (b.classId ? b.classId === c.id : (b.slot || '') === c.name)) }));
  const used = new Set(out.flatMap(x => x.bs.map(b => b.id)));
  const rest = list.filter(b => !used.has(b.id));
  [...new Set(rest.map(b => b.time))].forEach(t => out.push({ key: `x|${t}`, c: null, time: t, bs: rest.filter(b => b.time === t) }));
  out.forEach(x => x.bs.sort((a, b) => koSort(a.name, b.name)));
  return out.sort((a, b) => a.time.localeCompare(b.time));
}
const attendedSet = d => { const byId = Object.fromEntries(state.passes.map(p => [p.id, p])); return new Set(state.logs.filter(l => l.date === d).map(l => byId[l.passId]?.name || l.name)); };
const groupPlanFor = (plans, group, day, time) => plans.find(y => y.group === group && y.time === time && (y.days || [y.day]).includes(day)) || plans.find(y => y.group === group && !y.time && (y.days || [y.day]).includes(day)) || null;
const groupLogFor = (logs, group, day, time) => logs.find(g => g.group === group && g.date === day && (g.time || time) === time) || null;
// 목록 한 줄: 시간·반·상태 태그·명단(출석한 사람은 초록)
function sessItem(d, s, plans, glogs){
  const g = s.c && s.c.kind !== 'pt', att = attendedSet(d);
  const past = d < today() || (d === today() && s.time <= nowHM());
  const x = g ? groupPlanFor(plans, s.c.name, d, s.time) : null, done = g && groupLogFor(glogs, s.c.name, d, s.time);
  const tag = !g ? '' : done ? '<span class="tag">기록 완료</span>' : past ? (s.bs.length ? '<span class="tag amber">기록 전</span>' : '')  : x ? '<span class="tag gray">계획 있음</span>' : '<span class="tag red">계획 없음</span>';
  const who = s.bs.map(b => d <= today() && att.has(b.name) ? `<i class="ok">${esc(b.name)}</i>` : d < today() || past ? `<i class="no">${esc(b.name)}</i>` : esc(b.name)).join(', ');
  const cap = s.c?.cap;
  return `<div class="item"><button class="who" data-sess="${d}|${esc(s.key)}"><span class="nm"><span class="num tm">${s.time}</span>${esc(s.c ? s.c.name : '개인 PT')}${tag}</span><span class="meta">${who || '명단 없음'}</span></button><div class="cnt${cap && s.bs.length > cap ? ' out' : ''}"><b>${s.bs.length}</b><small>${cap ? '/ ' + cap + '명' : '명'}</small></div></div>`;
}

// 수업 하나: 명단(출석·빠짐) + 운동 계획 + 수업 기록

  dialog(`

}

function addBooking(date, time, classId){
  const act = state.passes.filter(p => !p.archived).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const c = state.classes.find(x => x.id === classId);
  dialog(`
    <div class="name">${fmtDay(date)} 예약 추가</div>
    ${c ? `<p class="hint">${esc(c.name)} ${esc(time)} 수업에 <b class="t-ink">이번만</b> 넣어요. 매주 오는 회원이면 반 관리에서 명단에 넣으세요.</p>` : '<p class="hint">개인 PT나 이번 한 번만 있는 예약을 넣어요.</p>'}
    <label for="b_time">시간</label><input id="b_time" type="time" step="1800" value="${time || '10:00'}" ${c ? 'disabled' : ''}>
    <label for="b_q">회원 (여러 명 선택 가능)</label>
    <input id="b_q" type="search" placeholder="이름 검색" autocomplete="off">
    <div id="b_list" class="picks">${act.map(p => `<label class="pick" data-n="${esc(p.name)}"><input type="checkbox" value="${p.id}"><span class="grow">${esc(p.name)} <span class="sub">${esc(p.cls)} · ${isMoney(p) ? '잔액 ' + won(moneyLeft(p)) : '남음 ' + left(p)}</span></span></label>`).join('')}</div>
    <div class="acts"><span class="grow"></span><button class="btn ghost" id="cn">취소</button><button class="btn" id="sv">예약</button></div>`);

  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    if ($('#sv').disabled) return;

    if (!t || !ids.length) return toast('시간과 회원을 골라 주세요');
    $('#sv').disabled = true;
    const batch = fb.writeBatch(db); const added = [];
    ids.forEach(id => {
      const p = state.passes.find(x => x.id === id);

      const ref = fb.doc(fb.collection(db, 'bookings'));
      const cc = c || classSlotsOn(date).find(x => x.time === t)?.c;
      const doc = { date, time: t, passId: id, name: p.name, cls: p.cls, slot: cc ? cc.name : '', ...(cc ? { classId: cc.id } : {}), notified: false, createdAt: fb.serverTimestamp() };

    state.books.push(...added);
    closeDlg(); toast(added.length ? `${added.length}명 예약했어요` : '이미 예약돼 있어요'); refresh();
  };
}

async function delBooking(id){
  const b = state.books.find(x => x.id === id);
  if (!confirm(`${b.name}님 ${fmtDay(b.date)} ${b.time} 예약을 취소할까요?`)) return;
  await fb.deleteDoc(fb.doc(db, 'bookings', id));
  state.books = state.books.filter(x => x.id !== id);
  toast('예약을 취소했어요'); refresh();
}
// 반 예약에서 이번 한 번만 빼기 (다음 주부터는 그대로)
async function skipBooking(id){
  const b = state.books.find(x => x.id === id); const c = state.classes.find(x => x.id === b?.classId);
  if (!b || !c) return delBooking(id);
  if (!confirm(`${b.name}님을 ${fmtDay(b.date)} ${b.time} ${c.name}에서 이번만 뺄까요?\n다음 수업부터는 그대로 예약돼요.`)) return;
  c.skips = [...new Set([...(c.skips || []).filter(k => k.slice(0, 10) >= today()), skipKey(b.date, b.time, b.name)])];
  const batch = fb.writeBatch(db);
  batch.update(fb.doc(db, 'classes', c.id), { skips: c.skips });
  batch.delete(fb.doc(db, 'bookings', id));
  await batch.commit();
  state.books = state.books.filter(x => x.id !== id);
  toast(`${b.name}님 이번만 빠짐`); refresh();
}
async function unskip(classId, key){
  const c = state.classes.find(x => x.id === classId); if (!c) return;
  c.skips = (c.skips || []).filter(k => k !== key);
  await fb.updateDoc(fb.doc(db, 'classes', c.id), { skips: c.skips });
  await syncAuto(); toast('다시 예약했어요'); refresh();
}

async function editClass(c){
  const isNew = !c;
  c = c || { name: '', kind: 'group', cap: 6, sessions: [{ wd: 2, time: '10:00' }], roster: [] };
  const names = [...new Set(state.passes.filter(p => !p.archived).map(p => p.name))].sort((a, b) => a.localeCompare(b, 'ko'));
  const inRos = new Set((c.roster || []).map(r => r.name));
  // 시간을 기준으로 요일을 묶어서 줄 하나로
  const byT = {}; (c.sessions || []).forEach(s => (byT[s.time] = byT[s.time] || []).push(s.wd));
  const rows = Object.entries(byT).map(([time, wds]) => ({ time, wds }));
  const rowHtml = (r, i) => `<div class="sess" data-row="${i}"><div class="wds">${[1, 2, 3, 4, 5, 6, 0].map(w => `<button type="button" data-wd="${w}" class="${r.wds.includes(w) ? 'on' : ''}" aria-pressed="${r.wds.includes(w)}">${WD[w]}</button>`).join('')}</div><input type="time" step="1800" value="${r.time}" aria-label="시간"><button type="button" class="btn line sm" data-rmrow aria-label="이 시간 지우기">－</button></div>`;
  dialog(`
    <div class="name">${isNew ? '새 반 만들기' : esc(c.name) + ' 수정'}</div>
    <label for="c_name">반 이름</label><input id="c_name" value="${esc(c.name)}" placeholder="예) 케틀벨 그룹 PT, 박서윤 PT">
    <div class="row g8"><div class="grow"><label for="c_kind">종류</label><select id="c_kind"><option value="group" ${c.kind !== 'pt' ? 'selected' : ''}>그룹 수업</option><option value="pt" ${c.kind === 'pt' ? 'selected' : ''}>개인 PT (고정 시간)</option></select></div>
      <div style="flex:0 0 110px"><label for="c_cap">정원</label><input id="c_cap" type="number" inputmode="numeric" min="1" value="${c.cap || ''}"></div></div>
    <label>요일과 시간</label><div id="c_rows">${rows.map(rowHtml).join('')}</div>
    <button type="button" class="btn line sm" id="c_addrow" style="margin-top:8px">+ 다른 시간 추가</button>
    <label for="c_q">명단 <span class="t-mut" id="c_cnt"></span></label>
    <div id="c_rec" class="hint"></div>
    <input id="c_q" type="search" placeholder="이름 검색" autocomplete="off">
    <div id="c_list" class="picks">${names.map(n => `<label class="pick" data-n="${esc(n)}"><input type="checkbox" value="${esc(n)}" ${inRos.has(n) ? 'checked' : ''}><span class="grow">${esc(n)}</span></label>`).join('')}</div>
    <label for="c_from">새로 넣는 회원은 이날부터 예약</label><input id="c_from" type="date" value="${addDays(today(), 1)}">
    <div class="acts">${isNew ? '' : '<button class="btn red" id="c_del">반 없애기</button>'}<span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  const cnt = () => { $('#c_cnt').textContent = `${document.querySelectorAll('#c_list input:checked').length}명`; };
  const bindRows = () => {
    document.querySelectorAll('#c_rows [data-wd]').forEach(b => b.onclick = () => { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); });
    document.querySelectorAll('#c_rows [data-rmrow]').forEach(b => b.onclick = () => { if (document.querySelectorAll('#c_rows .sess').length > 1) b.closest('.sess').remove(); });
  };
  bindRows(); cnt();
  $('#c_addrow').onclick = () => { $('#c_rows').insertAdjacentHTML('beforeend', rowHtml({ time: '10:00', wds: [] }, Date.now())); bindRows(); };
  $('#c_list').onchange = cnt;
  $('#c_q').oninput = e => document.querySelectorAll('#c_list [data-n]').forEach(l => l.style.display = l.dataset.n.includes(e.target.value.trim()) ? '' : 'none');
  $('#cn').onclick = closeDlg;
  if (!isNew) recentRegulars(c).then(reg => {
    const miss = reg.filter(([n]) => !inRos.has(n) && names.includes(n));
    if (!miss.length || !$('#c_rec')) return;
    $('#c_rec').innerHTML = `최근 4주 이 시간에 자주 온 회원: ${miss.map(([n, k]) => `<b class="t-ink">${esc(n)}</b>(${k}회)`).join(', ')} <button type="button" class="btn ghost sm" id="c_recAdd">명단에 넣기</button>`;
    $('#c_recAdd').onclick = () => { miss.forEach(([n]) => { const i = [...document.querySelectorAll('#c_list input')].find(x => x.value === n); if (i) i.checked = true; }); cnt(); $('#c_rec').textContent = ''; };
  }).catch(() => {});
  if ($('#c_del')) $('#c_del').onclick = async () => {
    if (!confirm(`${c.name} (${sessLbl(c)}) 반을 없앨까요?\n내일부터의 자동 예약도 지워져요. 지난 기록과 계획은 남아요.`)) return;
    await fb.updateDoc(fb.doc(db, 'classes', c.id), { active: false });
    c.active = false; const r = await syncAuto();
    closeDlg(); toast(`반을 없앴어요 · 예약 ${r.removed}개 지움`); refresh();
  };
  $('#sv').onclick = async () => {
    if ($('#sv').disabled) return;
    const name = $('#c_name').value.trim();
    const sessions = [...document.querySelectorAll('#c_rows .sess')].flatMap(r => { const t = r.querySelector('input[type=time]').value; return t ? [...r.querySelectorAll('[data-wd].on')].map(b => ({ wd: +b.dataset.wd, time: t })) : []; });
    const uniq = [...new Map(sessions.map(x => [x.wd + x.time, x])).values()];
    if (!name) return toast('반 이름을 넣어 주세요');
    if (!uniq.length) return toast('요일과 시간을 하나 이상 골라 주세요');

    const picked = [...document.querySelectorAll('#c_list input:checked')].map(i => i.value);
    const old = Object.fromEntries((c.roster || []).map(r => [r.name, r]));
    const roster = picked.map(n => old[n] || { name: n, from });
    const d = { name, kind: $('#c_kind').value, cap: +$('#c_cap').value || 0, sessions: uniq, roster, skips: (c.skips || []).filter(k => k.slice(0, 10) >= today()) };
    $('#sv').disabled = true;
    try {
      if (isNew) { const ref = await fb.addDoc(fb.collection(db, 'classes'), { ...d, active: true, createdAt: fb.serverTimestamp() }); state.classes.push({ id: ref.id, ...d, active: true }); }
      else { await fb.updateDoc(fb.doc(db, 'classes', c.id), d); Object.assign(c, d); }
      const r = await syncAuto();
      closeDlg(); toast(`저장했어요${r.added || r.removed ? ` · 예약 ${r.added ? '+' + r.added : ''}${r.added && r.removed ? ' / ' : ''}${r.removed ? '−' + r.removed : ''}` : ''}`); refresh();
    } catch(e) { $('#sv').disabled = false; toast('저장하지 못했어요. 다시 해 주세요'); }
  };
}

function passList(list, withBtn){
  if (!list.length) return `<div class="empty">해당하는 회원이 없어요</div>`;
  const done = withBtn ? new Set(state.logs.filter(l => l.date === ckDay()).map(l => l.passId)) : null;
  return `<div class="list">${list.map(p => {
    const [s, c] = status(p), bt = withBtn ? bookedTime(p.id) : '';
    const out = isMoney(p) ? moneyLeft(p) <= 0 : left(p) <= 0, isDone = done && done.has(p.id);
    const showTag = !['정상', '금액권'].includes(s);
    return `<div class="item">
    <button class="who" data-open="${p.id}">
      <span class="nm">${esc(p.name)}${showTag ? `<span class="tag ${c}">${s}</span>` : ''}${bt ? `<span class="tag blue">${bt} 예약</span>` : ''}</span>
      <span class="meta">${esc(p.cls)}${p.label ? ' · ' + esc(p.label) : ''}${p.lastDate ? ' · 최근 ' + esc(dayLbl(p.lastDate)) : ''}</span>
    </button>
    ${isMoney(p) ? `<div class="cnt money${out ? ' out' : ''}"><b>${won(moneyLeft(p))}</b><small>잔액</small></div>` : `<div class="cnt${out ? ' out' : left(p) <= 3 ? ' low' : ''}"><b>${left(p)}</b><small>/ ${p.total}회</small></div>`}
    ${withBtn ? `<button class="btn${isDone ? ' ghost' : ''}" data-ck="${p.id}" ${out ? 'disabled' : ''}>${isDone ? '완료' : '출석'}</button>` : ''}
  </div>`; }).join('')}</div>`;
}

function bindList(){
  // 출석 버튼은 누르는 동안 막아서 두 번 찍히지 않게
  app.querySelectorAll('[data-ck]').forEach(b => b.onclick = async () => { b.disabled = true; try { await checkIn(b.dataset.ck, ckDay()); } finally { if (b.isConnected) b.disabled = false; } });
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openPass(b.dataset.open));
}

function filtered(){
  const q = state.q.trim();
  return state.passes.filter(p => !p.archived)
    .filter(p => state.filter === '전체' || p.cls.includes(state.filter))
    .filter(p => !q || p.name.includes(q))
    .sort((a, b) => (bookedTime(a.id) || '99').localeCompare(bookedTime(b.id) || '99') || a.name.localeCompare(b.name, 'ko'));
}
function bookedTime(passId){
  const d = ckDay();
  const b = state.books.filter(x => x.passId === passId && x.date === d).map(x => x.time).sort();
  return b[0] || '';
}

// 오늘: 할 일 + 오늘 수업 + 회원 출석

  const d = today(), byId = Object.fromEntries(state.passes.map(p => [p.id, p]));
  const [wq, gq] = await Promise.all([fb.getDocs(fb.query(fb.collection(db, 'workouts'), fb.where('date', '==', d))), fb.getDocs(fb.query(fb.collection(db, 'groupWorkouts'), fb.where('date', '==', d)))]);

  act.forEach(p => { const [st] = status(p); if (['재등록 안내', '충전 안내', '곧 소진'].includes(st)) todos.push({ c: st === '곧 소진' ? 'amber' : 'red', t: `${p.name}님 ${st === '곧 소진' ? '재등록 안내' : st}`, s: isMoney(p) ? `잔액 ${won(moneyLeft(p))}` : `남은 ${left(p)}회 / ${p.total}회`, b: '보기', a: `p|${p.id}` }); });
  act.forEach(p => { if (status(p)[0] === '연락 필요') todos.push({ c: 'amber', t: `${p.name}님 연락 필요`, s: `${daysSince(p.lastDate)}일째 안 오셨어요`, b: '보기', a: `p|${p.id}` }); });

    ${showAll ? '' : `<button class="more-row" id="tdAll">할 일 ${todos.length - 6}개 더 보기</button>`}</div>` : '<div class="empty">오늘 할 일을 다 했어요</div>'}
  <h3 class="sec">오늘 수업 <span>${ss.length}</span></h3>

  <h3 class="sec">회원 출석</h3>
  <div id="ckArea"></div>`;
  app.querySelectorAll('[data-sess]').forEach(b => b.onclick = () => { const [dd, ...k] = b.dataset.sess.split('|'); openSession(dd, k.join('|')); });
  app.querySelectorAll('[data-todo]').forEach(b => b.onclick = () => {

/* ---------- 동작 ---------- */
const busyIds = new Set();
async function checkIn(passId, date){
  const p = state.passes.find(x => x.id === passId);
  if (!p || busyIds.has(passId)) return;
  if (isMoney(p)) return moneyCheckIn(p, date);
  if (state.logs.some(l => l.passId === passId && l.date === date) && !confirm(`${p.name}님은 ${fmtDay(date)}에 이미 출석했어요. 한 번 더 찍을까요?`)) return;
  busyIds.add(passId);
  try { await saveCheckIn(p, date); } finally { busyIds.delete(passId); }
  if (isPT(p)) writeWorkout(p.name, date);
}
async function saveCheckIn(p, date){
  const passId = p.id;
  const ref = fb.doc(fb.collection(db, 'attendance'));
  const batch = fb.writeBatch(db);
  batch.set(ref, { passId, name: p.name, date, createdAt: fb.serverTimestamp() });
  const newLast = !p.lastDate || date > p.lastDate ? date : p.lastDate;
  batch.update(fb.doc(db, 'passes', passId), { usedAfter: fb.increment(1), lastDate: newLast });
  await batch.commit();
  p.usedAfter = (p.usedAfter || 0) + 1; p.lastDate = newLast;
  state.logs.unshift({ id: ref.id, passId, name: p.name, date });
  toast(`${p.name}님 출석 · 남은 ${left(p)}회`);
  refresh();
}

function moneyCheckIn(p, date){
  dialog(`
    <div class="name">${esc(p.name)}님 출석 · 어떤 수업인가요?</div>
    <p class="hint">현재 잔액 ${won(moneyLeft(p))}</p>
    <div class="stack">
      <button class="btn" data-mk="개인">개인 PT · −${won(p.priceP)}</button>
      <button class="btn" data-mk="그룹">그룹 수업 · −${won(p.priceG)}</button>
    </div>
    <div class="acts"><span class="grow"></span><button class="btn ghost" id="cn">취소</button></div>`);
  $('#cn').onclick = closeDlg;
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.mk, amount = kind === '개인' ? (p.priceP || 0) : (p.priceG || 0);
    if (busyIds.has(p.id)) return;
    if (state.logs.some(l => l.passId === p.id && l.date === date) && !confirm(`${p.name}님은 ${fmtDay(date)}에 이미 출석했어요. 한 번 더 찍을까요?`)) return;
    if (amount > moneyLeft(p) && !confirm(`잔액(${won(moneyLeft(p))})보다 차감액이 커요. 그래도 출석할까요?`)) return;
    busyIds.add(p.id); document.querySelectorAll('[data-mk]').forEach(x => x.disabled = true);
    try {
      const ref = fb.doc(fb.collection(db, 'attendance'));
      const batch = fb.writeBatch(db);
      const log = { passId: p.id, name: p.name, date, kind, amount, createdAt: fb.serverTimestamp() };
      batch.set(ref, log);
      const newLast = !p.lastDate || date > p.lastDate ? date : p.lastDate;
      batch.update(fb.doc(db, 'passes', p.id), { spent: fb.increment(amount), lastDate: newLast });
      await batch.commit();
      p.spent = (p.spent || 0) + amount; p.lastDate = newLast;
      state.logs.unshift({ id: ref.id, ...log });
    } finally { busyIds.delete(p.id); }
    closeDlg(); toast(`${p.name}님 ${kind} 출석 · 잔액 ${won(moneyLeft(p))}`); refresh();
    if (kind === '개인') writeWorkout(p.name, date);
  });
}

/* ---------- 출석 QR ---------- */
const CHECK_URL = 'https://rlaehgus114-dev.github.io/moveplay_sc/check/';
// 출석 비밀 값 (QR과 센터 태블릿 화면이 같은 값을 써요. 새로 만들면 둘 다 바뀌어요)
async function qrKey(renew){
  const ref = fb.doc(db, 'config', 'qr');
  let key = renew ? '' : ((await fb.getDoc(ref)).data() || {}).key;
  if (!key) {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    key = [...a].map(b => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join('');
    await fb.setDoc(ref, { key, updatedAt: fb.serverTimestamp() });
  }
  return key;
}
async function kioskLink(open){
  let url;
  try { url = CHECK_URL + '?k=' + await qrKey(false) + '&kiosk=1'; } catch(e) { return toast('주소를 못 만들었어요: ' + e.message); }
  if (open) { location.href = url; return; }
  try { await navigator.clipboard.writeText(url); toast('주소를 복사했어요. 태블릿에서 열어 주세요'); }
  catch(e) { prompt('이 주소를 태블릿 브라우저에서 열어 주세요', url); }
}
async function qrPrint(renew){
  const w = window.open('', '_blank');
  if (!w) return toast('팝업이 막혀 있어요. 팝업을 허용해 주세요');
  w.document.write('<p style="font:20px sans-serif;padding:40px">QR 만드는 중…</p>');
  try {
    const key = await qrKey(renew);
    if (!window.qrcode) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    const q = window.qrcode(0, 'M'); q.addData(CHECK_URL + '?k=' + key); q.make();
    w.document.open();
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>무브앤플레이 출석 QR</title><style>
      @page{size:A4;margin:0}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2421}
      .p{width:210mm;height:297mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-top:18mm solid #1f6f4a}
      h1{font-size:44pt;margin:0 0 6mm;letter-spacing:-.03em}p{font-size:18pt;margin:0 0 12mm;color:#4a524d;line-height:1.6}
      .q svg{width:120mm;height:120mm}.s{margin-top:12mm;font-size:15pt;color:#6b746f;line-height:1.7}b{color:#1f6f4a}</style></head><body><div class="p">
      <h1>출석 QR</h1><p>휴대폰 카메라로 찍고<br><b>출석하기</b>를 눌러 주세요</p><div class="q">${q.createSvgTag({ cellSize: 8, margin: 2, scalable: true })}</div>
      <div class="s">처음 한 번만 휴대폰 번호를 넣으면<br>다음부터는 버튼 하나로 출석돼요<br><br>무브앤플레이 순천점</div></div>
      <script>setTimeout(()=>print(),400)<\/script></body></html>`);
    w.document.close();
  } catch(e) { w.close(); toast('QR을 못 만들었어요: ' + e.message); }
}

async function undo(logId){
  const l = state.logs.find(x => x.id === logId); if (!l) return;
  if (!confirm(`${l.name}님 ${l.date} 출석을 취소할까요?`)) return;
  const p = state.passes.find(x => x.id === l.passId);
  const batch = fb.writeBatch(db);
  batch.delete(fb.doc(db, 'attendance', logId));
  const rest = state.logs.filter(x => x.passId === l.passId && x.id !== logId).map(x => x.date).sort();
  const newLast = rest.length ? rest[rest.length - 1] : p ? (p.importedLast || p.lastDate) : null;
  if (p && l.amount) batch.update(fb.doc(db, 'passes', p.id), { spent: fb.increment(-l.amount), lastDate: newLast || null });
  else if (p) batch.update(fb.doc(db, 'passes', p.id), { usedAfter: fb.increment(-1), lastDate: newLast || null });
  await batch.commit();
  if (p && l.amount) { p.spent = (p.spent || 0) - l.amount; p.lastDate = newLast; }
  else if (p) { p.usedAfter = (p.usedAfter || 0) - 1; p.lastDate = newLast; }
  state.logs = state.logs.filter(x => x.id !== logId);
  toast('취소했어요'); refresh();
}

/* ---------- 운동 기록 ---------- */
const isPT = p => /1:1|2:1/.test(p.cls || '') && !/^그룹/.test(p.cls || '');
const wkSort = (a, b) => (b.date || '9999').localeCompare(a.date || '9999');
const wkDay = w => w.dateLabel || (w.date ? fmtDay(w.date) : '날짜 미기재');
async function loadWorkouts(member){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'workouts'), fb.where('member', '==', member)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(wkSort);
}
function wkMeta(w){
  const a = [];
  if (w.painBefore !== undefined && w.painBefore !== '') a.push(`통증 ${w.painBefore}${w.painAfter !== undefined && w.painAfter !== '' ? '→' + w.painAfter : ''}`);
  (w.measures || []).forEach(m => m.value !== '' && a.push(`${m.name} ${m.value}`));
  return a.length ? `<div class="wk-meta">${esc(a.join(' · '))}</div>` : '';
}
function wkCard(w, tools){
  return `<div class="wk"><div class="d"><span>${esc(wkDay(w))}${w.note ? ' · ' + esc(w.note) : ''}</span>${tools ? `<span><button class="btn ghost sm" data-we="${w.id}">수정</button></span>` : ''}</div>
    ${wkMeta(w)}<ul>${(w.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>${w.homework ? `<div class="hw">숙제 · ${esc(w.homework)}</div>` : ''}</div>`;
}
// 변화 요약: 기록 중 가장 처음 값 → 가장 최근 값
function progress(wks){
  const asc = wks.filter(w => w.date).slice().sort((a, b) => a.date.localeCompare(b.date));
  const out = [];
  const pb = asc.filter(w => w.painBefore !== undefined && w.painBefore !== '');
  if (pb.length >= 2) out.push(['수업 전 통증', pb[0].painBefore, pb[pb.length - 1].painBefore, pb[0].date, pb[pb.length - 1].date]);
  const names = [...new Set(asc.flatMap(w => (w.measures || []).filter(m => m.value !== '').map(m => m.name)))];
  names.forEach(n => {
    const v = asc.map(w => ({ d: w.date, m: (w.measures || []).find(m => m.name === n && m.value !== '') })).filter(x => x.m);
    if (v.length >= 2) out.push([n, v[0].m.value, v[v.length - 1].m.value, v[0].d, v[v.length - 1].d]);
  });
  return out;
}
function topMoves(wks){
  const cnt = {}, label = {};
  wks.forEach(w => (w.items || []).forEach(i => { const t = i.split(' - ')[0].trim(), k = t.replace(/\s/g, ''); if (t.length <= 24) { cnt[k] = (cnt[k] || 0) + 1; label[k] = label[k] || t; } }));
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => label[x[0]]);
}
function painOpts(v, label){
  return `<option value="">${label} 미기록</option>` + [...Array(11).keys()].map(i => `<option value="${i}" ${String(v) === String(i) ? 'selected' : ''}>${label} ${i}</option>`).join('');
}
async function setMeasures(member, cur){
  const t = prompt(`${member}님 재평가 항목 (쉼표로 구분, 1~3개)\n예) 무릎 굴곡 각도, 한 발 서기(초)`, (cur || []).join(', '));
  if (t === null) return false;
  const arr = t.split(',').map(x => x.trim()).filter(Boolean).slice(0, 3);
  await fb.setDoc(fb.doc(db, 'profiles', member), { measureNames: arr }, { merge: true });
  toast('재평가 항목을 저장했어요'); return true;
}
async function showWorkouts(member){
  const wks = await loadWorkouts(member);
  dialog(`<div class="row"><div class="grow name">${esc(member)}님 운동 기록 ${wks.length}회</div><button class="btn" id="cl">닫기</button></div>
    ${wks.map(w => wkCard(w, true)).join('')}`);
  $('#cl').onclick = closeDlg;
  document.querySelectorAll('[data-we]').forEach(b => b.onclick = () => writeWorkout(member, null, wks.find(w => w.id === b.dataset.we)));
}
async function writeWorkout(member, date, existing){
  const [wks, prof] = await Promise.all([loadWorkouts(member), fb.getDoc(fb.doc(db, 'profiles', member))]);
  const mNames = (prof.exists() && prof.data().measureNames) || [];
  const last = wks.find(w => !existing || w.id !== existing.id);
  const moves = topMoves(wks);
  const w = existing || { date: date || today(), items: [], homework: '', note: '' };
  let plan = null;
  if (!existing) {
    const ps = (await loadPlans(member)).filter(x => !x.done);
    const d0 = w.date, wk = weekStart(d0);
    plan = ps.find(x => x.day === d0) || ps.filter(x => x.week === wk).sort((a, b) => (a.day || '9').localeCompare(b.day || '9'))[0] || null;
    if (plan) { w.items = plan.items || []; w.homework = plan.homework || ''; }
  }
  dialog(`
    <div class="name">${esc(member)}님 ${existing ? '운동 기록 수정' : '오늘 운동 기록'}</div>
    <label>날짜</label><input type="date" id="w_d" value="${esc(w.date && !w.date.endsWith('-00') ? w.date : today())}">

    ${moves.length ? `<label>자주 한 운동 (누르면 추가)</label><div class="chipset">${moves.map(m => `<button data-mv="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}

/* ---------- 주간 계획 ---------- */
const weekStart = s => { const d = new Date(s + 'T00:00:00Z'); const k = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - k); return d.toISOString().slice(0, 10); };
async function loadPlans(member){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'plans'), fb.where('member', '==', member)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function loadGroupLogs(group){
  const snap = await fb.getDocs(fb.query(fb.collection(db, 'groupWorkouts'), fb.where('group', '==', group)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.date.localeCompare(a.date));
}
const fmtDays = ds => ds.map(fmtDay).join(' · ');
const shortWd = d => WD[wdOf(d)];
function groupDone(x, day, days, time, group){
  const grp = x ? x.group : group;
  day = day || x.day; days = days || [x?.day]; time = time || x?.time || '';
  dialog(`<div class="name">${esc(fmtDay(day))} ${esc(time)} ${esc(grp)} 수업 기록</div>
    <p class="hint">${x ? '계획대로 했으면 그대로 저장, 바뀐 건 고쳐서 저장하세요.' : '오늘 한 운동을 한 줄에 하나씩 적어 주세요.'}</p>
    <label>한 운동</label><textarea id="g_i" rows="7">${esc((x?.items || []).join('\n'))}</textarea>
    <label>메모 (분위기·다음에 바꿀 점)</label><input id="g_n">
    <div class="acts"><span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  $('#cn').onclick = closeDlg;
  $('#sv').onclick = async () => {
    const items = $('#g_i').value.split('\n').map(t => t.trim()).filter(Boolean);
    if (!items.length) return toast('운동을 한 줄 이상 적어 주세요');
    $('#sv').disabled = true;
    await fb.addDoc(fb.collection(db, 'groupWorkouts'), { group: grp, date: day, time, items, note: $('#g_n').value.trim(), createdAt: fb.serverTimestamp() });
    if (!x) { closeDlg(); toast('그룹 수업 기록을 저장했어요'); return refresh(); }
    const key = x.time ? day : day + ' ' + time;   // 예전 공통 계획이면 타임별로 완료 표시
    const doneDays = [...new Set([...(x.doneDays || (x.done ? [x.day] : [])), key])];
    const allDone = x.time ? days.every(d => doneDays.includes(d)) : false;
    await fb.updateDoc(fb.doc(db, 'plans', x.id), days.length > 1 || !x.time ? { doneDays, done: allDone, doneDate: day } : { done: true, doneDate: day, items, doneDays });
    closeDlg(); toast('그룹 수업 기록을 저장했어요'); refresh();
  };
}
async function editPlan(member, wk, ex, group, fixedDays, time, weekPlans, base){
  time = time || '';
  const fixedDay = Array.isArray(fixedDays) ? fixedDays[0] : fixedDays;
  fixedDays = Array.isArray(fixedDays) ? fixedDays : [fixedDays];
  let wks, ps;
  if (group) {
    wks = await loadGroupLogs(group);
    if (time) { const same = wks.filter(w => w.time === time); if (same.length) wks = [...same, ...wks.filter(w => w.time !== time)]; }
    const sp = await fb.getDocs(fb.query(fb.collection(db, 'plans'), fb.where('group', '==', group)));
    ps = sp.docs.map(d => ({ id: d.id, ...d.data() }));
  } else [wks, ps] = await Promise.all([loadWorkouts(member), loadPlans(member)]);
  const last = wks[0], prev = ps.filter(x => x.id !== (ex && ex.id)).sort((a, b) => (b.week + (b.day || '')).localeCompare(a.week + (a.day || '')))[0];
  const moves = topMoves(wks);
  const days = [0, 1, 2, 3, 4, 5].map(i => addDays(wk, i));
  const x = ex || { day: fixedDay || '', title: base ? base.title || '' : '', items: base ? base.items || [] : [], homework: '' };
  // 같은 날 다른 타임 계획 (불러오기용)
  const sibs = group ? (weekPlans || []).filter(y => y.group === group && y.id !== (ex && ex.id) && !(y.time === time && fixedDays.includes(y.day))).sort((a, b) => (a.day + (a.time || '')).localeCompare(b.day + (b.time || ''))) : [];
  dialog(`
    <div class="name">${group ? esc(fmtDays(fixedDays)) + ' ' + esc(time) + ' ' + esc(group) : esc(member) + '님'} ${group ? '수업' : fmtDay(wk) + ' 주'} 계획</div>
    ${group ? `<p class="hint">${time ? esc(time) + ' 타임만의 계획이에요.' + (fixedDays.length > 1 ? ' (' + fixedDays.map(shortWd).join('·') + ' 같은 계획)' : '') : '예전에 만든 모든 타임 공통 계획이에요.'}${base && !ex ? ' 공통 계획을 채워 뒀어요. 이 타임에 맞게 고치세요.' : ''}</p>` : ''}
    ${sibs.length ? `<label>이번 주 다른 요일·타임 계획 불러오기</label><div class="chipset">${sibs.map(y => `<button data-sib="${y.id}">${esc(shortWd(y.day))} ${esc(y.time || '공통')}${y.title ? ' · ' + esc(y.title) : ''}</button>`).join('')}</div>` : ''}
    <label style="${group ? 'display:none' : ''}">수업 요일 (모르면 비워 두세요)</label>
    <select id="p_d" style="${group ? 'display:none' : ''}"><option value="">요일 미정</option>${days.map(d => `<option value="${d}" ${x.day === d ? 'selected' : ''}>${fmtDay(d)}</option>`).join('')}</select>
    <label>제목 (선택, 예: 하체·코어)</label><input id="p_t" value="${esc(x.title || '')}">
    ${last ? `<div class="wk soft"><div class="d"><span>지난 ${group ? '같은 수업' : '수업'} · ${esc(wkDay(last))}</span><button class="btn ghost sm" id="p_last">불러오기</button></div><ul>${(last.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : ''}
    ${prev ? `<div class="row" style="margin-top:6px"><span class="grow hint">지난 계획 (${prev.day ? esc(fmtDay(prev.day)) : esc(fmtDay(prev.week)) + ' 주'})</span><button class="btn ghost sm" id="p_prev">불러오기</button></div>` : ''}
    ${moves.length ? `<label>자주 한 운동 (누르면 추가)</label><div class="chipset">${moves.map(m => `<button data-mv="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}
    <label>할 운동 (한 줄에 하나씩)</label>
    <textarea id="p_i" rows="7">${esc((x.items || []).join('\n'))}</textarea>
    <label>숙제 (선택)</label><input id="p_h" value="${esc(x.homework || '')}">
    <div class="acts">${ex ? '<button class="btn red" id="p_del">삭제</button>' : ''}<span class="grow"></span><button class="btn ghost" id="cn">닫기</button><button class="btn" id="sv">저장</button></div>`);
  const ta = $('#p_i');
  const add = t => { ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' : '') + t; };
  if ($('#p_last')) $('#p_last').onclick = () => { ta.value = (last.items || []).join('\n'); toast('지난 수업을 불러왔어요. 이번 주에 바꿀 것만 고치세요'); };
  if ($('#p_prev')) $('#p_prev').onclick = () => { ta.value = (prev.items || []).join('\n'); if (!$('#p_h').value) $('#p_h').value = prev.homework || ''; toast('지난 계획을 불러왔어요'); };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => add(b.dataset.mv));
  document.querySelectorAll('[data-sib]').forEach(b => b.onclick = () => { const y = sibs.find(z => z.id === b.dataset.sib); ta.value = (y.items || []).join('\n'); if (!$('#p_t').value) $('#p_t').value = y.title || ''; toast(shortWd(y.day) + ' ' + (y.time || '') + ' 계획을 불러왔어요. 바꿀 것만 고치세요'); });
  $('#cn').onclick = closeDlg;
  if ($('#p_del')) $('#p_del').onclick = async () => { if (!confirm('이 계획을 지울까요?')) return; await fb.deleteDoc(fb.doc(db, 'plans', ex.id)); closeDlg(); refresh(); };
  $('#sv').onclick = async () => {
    const items = ta.value.split('\n').map(t => t.trim()).filter(Boolean);
    if (!items.length) return toast('운동을 한 줄 이상 적어 주세요');
    const d = { member: member || '', group: group || '', week: wk, day: group ? fixedDay : $('#p_d').value, ...(group ? { days: fixedDays, time: ex ? (ex.time || '') : time } : {}), title: $('#p_t').value.trim(), items, homework: $('#p_h').value.trim() };
    if (ex) await fb.updateDoc(fb.doc(db, 'plans', ex.id), d);
    else await fb.addDoc(fb.collection(db, 'plans'), { ...d, done: false, createdAt: fb.serverTimestamp() });
    closeDlg(); toast('계획을 저장했어요'); refresh();
  };
}

  $('#sv').onclick = async () => {
    const d = { name: $('#f_name').value.trim(), cls: $('#f_cls').value, label: $('#f_label').value.trim(), kind: $('#f_kind').value,
      total: +$('#f_total').value || 0, phone: $('#f_phone').value.replace(/\D/g, ''), note: $('#f_note').value.trim() };
    d.phone4 = d.phone.slice(-4);
    if (d.kind === '금액권') {
      d.balance = +$('#f_bal').value || 0; d.priceP = +$('#f_pp').value || 0; d.priceG = +$('#f_pg').value || 0; d.total = 0;
      if (!d.name || !d.balance) return toast('이름과 충전 금액을 넣어 주세요');
      if (isNew) d.spent = 0;
    } else if (!d.name || !d.total) return toast('이름과 등록 횟수를 넣어 주세요');
    if (d.phone && !/^01\d{8,9}$/.test(d.phone)) return toast('휴대폰 번호를 확인해 주세요');
    if (isNew) {
      const ref = await fb.addDoc(fb.collection(db, 'passes'), { ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false, startDate: today(), createdAt: fb.serverTimestamp() });
      state.passes.push({ id: ref.id, ...d, usedBefore: 0, usedAfter: 0, lastDate: null, archived: false });
      if (p._renew) { await fb.updateDoc(fb.doc(db, 'passes', p._renew), { archived: true }); state.passes.find(x => x.id === p._renew).archived = true; }
    } else {
      if (d.kind !== '금액권') d.usedBefore = +$('#f_ub').value || 0;
      await fb.updateDoc(fb.doc(db, 'passes', p.id), d);
      Object.assign(p, d);
    }
    closeDlg(); toast('저장했어요'); refresh();
  };
}

async function importFile(file){
  if (!file) return;
  let rows; try { rows = JSON.parse(await file.text()); } catch (e) { return toast('파일을 읽을 수 없어요'); }
  if (state.passes.length && !confirm(`이미 이용권이 ${state.passes.length}개 있어요. 그래도 추가할까요? (중복될 수 있어요)`)) return;
  const batch = fb.writeBatch(db);
  rows.forEach(r => batch.set(fb.doc(fb.collection(db, 'passes')), {
    name: r.name, cls: r.cls, label: r.label || '', kind: r.kind || '', total: r.total || 0,
    usedBefore: r.used || 0, usedAfter: 0, lastDate: r.lastDate || null, importedLast: r.lastDate || null,
    phone4: r.phone4 || '', note: r.note || '', archived: !!r.archived, startDate: null, createdAt: fb.serverTimestamp()
  }));
  await batch.commit();
  await loadAll(); toast(`${rows.length}개 가져왔어요`); state.tab = 'members';
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'members')); render();
}

async function backup(){
  const a = await fb.getDocs(fb.collection(db, 'attendance'));
  const data = { exportedAt: new Date().toISOString(), passes: state.passes, attendance: a.docs.map(d => ({ id: d.id, ...d.data(), createdAt: null })) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  const el = document.createElement('a'); el.href = url; el.download = `무플_백업_${today()}.json`; el.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function dialog(html){ const d = $('#dlg'); $('#dlgBody').innerHTML = html; if (!d.open) d.showModal(); d.scrollTop = 0; }
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDlg(); });
function closeDlg(){ $('#dlg').close(); }
</script>
